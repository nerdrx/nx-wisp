[package]
name = "wisp-fleet"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
wisp-proto = { path = "../wisp-proto" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = [
    "rt",
    "sync",
    "time",
    "macros",
    "net",
    "io-util",
    "fs",
    "process",
] }
tracing = "0.1.44"
thiserror = "2.0.20"
# The WebSocket handshake needs SHA-1 + base64 and nothing else; the framing is
# hand-rolled from RFC 6455 so this crate carries no WebSocket dependency.
sha1 = "0.10.6"
base64 = "0.22.1"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "test-util"] }
tempfile = "3.23.0"
