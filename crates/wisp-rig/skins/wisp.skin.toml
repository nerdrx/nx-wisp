# --- constraints ----------------------------------------------------------------

# F69: her eyes track the cursor. Still a narrow cone — a companion that
# swivels 90 degrees reads as a turret, not as attention — but the eyes sit 54
# units above the pivot, so 16 degrees slides them 15 units across a 128-unit
# face. That is a glance you can see at 96 px, and it is as far as the cone can
# open before an eye starts to leave her cheek.
[[ik]]
name = "gaze"
kind = "look_at"
bone = "gaze"
target = "cursor"
forward = [0.0, -1.0]
max_deg = 16.0
weight = 0.85

# Available for scripted reaching — wrapping a tail round a window edge (F68).
# Nothing drives it by default, so the spring chains below own the tails.
[[ik]]
name = "tail_reach"
kind = "two_bone"
root = "tail_l1"
mid = "tail_l2"
end = "tail_l3"
target = "none"
bend_positive = true

# F67's secondary motion. The tails arrive late and keep going after she stops,
# which is most of what makes a twin-tailed character look alive. Light and
# draggy: this is hair, not rope.
[[chain]]
name = "tail_l"
bones = ["tail_l1", "tail_l2", "tail_l3"]
stiffness = 150.0
damping = 15.0
mass = 1.0
gravity = 40.0
drag = 1.4
stiff_length = 1.0

[[chain]]
name = "tail"
bones = ["tail1", "tail2", "tail3"]
stiffness = 150.0
damping = 15.0
mass = 1.0
gravity = 40.0
drag = 1.4
stiff_length = 1.0
