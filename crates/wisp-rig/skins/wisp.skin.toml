# --- the lit edge -------------------------------------------------------------
# One hairline of gradient border round the head, bright top-left to dark
# bottom-right, drawn last so nothing covers it. Everything else that touches
# the outside world — tails, dress, feet — carries the same stroke on its own
# shape, and between them they are what separate her from any wallpaper.

[[shape]]
