# --- hair over the face ------------------------------------------------------

# The fringe, and the single most important shape in the file. A smooth arc
# here is a visor; this broken hem is the whole difference between "astronaut"
# and "girl", and it costs nineteen line segments.
#
# The shape of the break matters as much as having one. Two earlier attempts
# failed:
#
#   * a smooth curve — the helmet;
#   * an even zigzag cut nearly to the hairline — which sounds like the obvious
#     way to make a jagged edge and instead produces a jester's crown, because
#     a zigzag makes the *skin* wedges exactly as large as the hair ones and
#     the eye reads whichever is paler. It looked worse than the helmet.
#
# What works is what anime actually draws: **two big swept locks meeting at a
# narrow parting**, each lock's hem broken by two points rather than by a comb
# of teeth. Reading outward from the middle, the hem hits 124 and 132 at y = 66
# either side of the part, rises to 108 / 148 at y = 54, drops to points at 96
# / 160 at y = 74, rises again at 80 / 176, and ends in the long outer points
# at 66 and 190 at y = 90, which are the two the eye actually registers at
# 96 px because there is no brow under them.
#
# The parting itself is a *narrow* V — eight units wide, cut up to y = 42. A
# narrow deep notch reads as a parting; a wide shallow one reads as a bald
# patch, which is what the previous attempt produced.
#
# It ends well inside a face that runs 24 to 142 — the cheeks, the mouth and
# the chin are bare skin. Hair *frames*; a helmet encloses.
[[shape]]
name = "hair_front"
z = 36
silhouette = true
path = """
M 58 58
C 58 32, 87 8, 128 8
C 169 8, 198 32, 198 58
L 190 90
L 176 58
L 160 74
L 148 54
L 132 66
L 128 42
L 124 66
L 108 54
L 96 74
L 80 58
L 66 90
Z"""
bind = "head"
fill = { gradient = "hair" }

# The two locks that frame her cheeks. Sixteen units wide, straddling the edge
