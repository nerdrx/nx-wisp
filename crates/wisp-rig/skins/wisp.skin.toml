# Brows, drawn over the fringe. Anime does this and it is not an accident: a
# brow hidden under hair is a brow that cannot act, and the brows are the
# strongest expression channel she has at 96 px. They sit three units lower
# than they used to, which puts them under the inner fringe tips instead of on
# top of them.
[[shape]]
name = "brow_l"
z = 41
silhouette = false
path = "M 100.499 59.435 C 107.609 58.4358 113.597 59.2219 113.873 61.1907 C 114.15 63.1596 108.611 65.5657 101.501 66.565 C 94.3912 67.5642 88.4032 66.7781 88.1265 64.8093 C 87.8498 62.8404 93.3891 60.4343 100.499 59.435 Z"
bind = "brow_l"
fill = { color = "lash" }

[[shape]]
name = "brow_r"
z = 41
silhouette = false
path = "M 155.501 59.435 C 162.611 60.4343 168.15 62.8404 167.873 64.8093 C 167.597 66.7781 161.609 67.5642 154.499 66.565 C 147.389 65.5657 141.85 63.1596 142.127 61.1907 C 142.403 59.2219 148.391 58.4358 155.501 59.435 Z"
bind = "brow_r"
fill = { color = "lash" }

# The crown highlight, riding the light bone. Kept well inside the hair outline
# so it cannot ghost past her edge onto the wallpaper.
[[shape]]
name = "sheen"
z = 42
opacity = 0.38
silhouette = false
path = """
M 128 16
C 163 16, 190 44, 190 82
C 190 110, 170 132, 128 132
C 86 132, 66 110, 66 82
C 66 44, 93 16, 128 16
Z"""
bind = "head"
fill = { gradient = "sheen" }

# --- the lit edge -------------------------------------------------------------
# One hairline of gradient border round the hair, bright top-left to dark
# bottom-right, drawn last so nothing covers it. It traces `hair_back` exactly,
# spikes included, so the broken outline is *drawn* rather than merely implied.
# Everything else that touches the outside world — tails, jacket, skirt, boots
# — carries the same stroke on its own shape, and between them they are what
# separate her from any wallpaper.

[[shape]]
name = "edge"
z = 44
silhouette = false
path = """
M 128 8
C 169 8, 198 38, 198 82
C 198 104, 197 120, 194 132
L 202 158
L 190 136
L 186 160
L 176 132
C 168 145, 148 151, 128 151
C 108 151, 88 145, 80 132
L 70 160
L 66 136
L 54 158
L 62 132
C 59 120, 58 104, 58 82
C 58 38, 87 8, 128 8
Z"""
bind = "head"
stroke = { gradient = "edge_lit", width = 2.8, join = "round" }

# --- animation layers ---------------------------------------------------------
# Evaluated in order. The base layer carries where she is and what she is
# doing; the three additive layers on top are what stop her ever freezing
# (F70) — she breathes and blinks while she walks.

[[layer]]
name = "base"
additive = false
default_clip = "idle"

[[layer]]
name = "breathe"
additive = true
default_clip = "breathe"

[[layer]]
name = "blink"
additive = true
default_clip = "blink"

[[layer]]
name = "face"
additive = true
default_clip = "expr.neutral"

