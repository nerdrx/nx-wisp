# Wisp — the default NX Wisp skin (F73, attempt 3: an actual wisp)
#
# A small floating spirit made of light. A round violet-glass body with a hot
# cyan flame burning inside it, two big eyes sitting directly in that light,
# and a trail of light falling away underneath her that breaks into motes.
#
# She is **not humanoid**. No skin, no outfit, no arms, no legs, no hair, no
# nose, no brows-on-a-forehead. There is no head and no head/body division —
# there is one mass of light, and the eyes are in it.
#
# Everything here is data. There is no expression language in this format and
# no way for a skin to run code (SPEC.md §3.6).
#
# ----------------------------------------------------------------------------
# Why this file looks nothing like the last two
# ----------------------------------------------------------------------------
#
# Two designs failed before this one, and both failures are load-bearing:
#
#   **Attempt 1 — a faceted dark crystal.** A dark violet angular mote. At
#   96 px it was an unreadable smudge, and it read as ominous rather than
#   friendly. It died of *darkness* and of *being small* — it occupied 130 of
#   the canvas's 256 units. Nothing in this file is allowed to be near-black,
#   and nothing is allowed to leave the canvas empty.
#
#   **Attempt 2 — a chibi humanoid.** Correct proportions, legible at 96 px,
#   technically fine, and wrong. The verdict was "the sprites aint gonna get
#   any cute like that its just uncanny". The reason is structural rather than
#   fixable: **a humanoid figure at sprite scale falls into the uncanny
#   valley.** A face with human anatomy — skin, brows, a nose position, a
#   mouth, an outfit — invites the viewer to read it as a person, and at 96 px
#   it cannot deliver on that, so it reads as a *wrong person*. No amount of
#   iteration fixes the premise.
#
# A non-humanoid creature escapes the valley entirely. Nobody measures a flame
# or a ghost against a real person, so there is no gap to fall into. That is
# the whole argument for this design, and it is why re-adding a nose, a chin,
# limbs, clothing or hair would not be an improvement — it would be attempt 2.
#
# Cuteness here comes from exactly three things, and there is no fourth:
#
#   1. **a simple round shape**  — see below, this is the biggest lever;
#   2. **big eyes**              — 64% of her width, and byte-identical to the
#                                  geometry that tested well in both previous
#                                  attempts;
#   3. **good motion**           — spring chains, squash-and-stretch and IK,
#                                  all of which already existed and none of
#                                  which needed changing for this rewrite.
#
# ----------------------------------------------------------------------------
# Round. Actually round.
# ----------------------------------------------------------------------------
#
# The brief for this attempt said "teardrop, flame or droplet". The operator
# then narrowed it to "but round n stuff", and that narrowing is correct and
# is the single most important line in this comment:
#
#     Her BODY is one clean round soft mass. The wispiness lives in what
#     trails OFF her — the tail, the motes, the halo. It never lives in her
#     outline.
#
# So there is no pointed apex, there are no flame licks on the body, and there
# is no notched or chopped-up silhouette. Roundness is the strongest cuteness
# signal available to a non-humanoid *and* it is the shape that best survives
# being small, because a circle at 20 px is still a circle while a serrated
# edge at 20 px is mush.
#
# The older "a broken silhouette edge reads better than a smooth closed curve"
# note still holds — but it is satisfied by the trail and the detached motes
# hanging below and beside her, not by damaging the body. Body round and
# simple, edges soft, wisp in the trail.
#
#     body top          y =  14   ─┐
#     eye centreline    y =  96    │ the round mass = 154 x 154 units
#     body bottom       y = 168   ─┘
#     trail             y = 138-238   the wisp part; its top 30 units are
#                                     hidden inside the glass
#     lowest mote       y = 248
#                                   total occupied = 234 of 256 units
#
# The mass is 154 units wide and 154 tall, which is not a coincidence — she is
# a circle. The eyes then land at 53% of her height, just below centre, which
# is where a cute animal's eyes are and where a person's are not. An earlier
# pass in this attempt made her 164 tall, and the extra ten units of blank body
# under the eyes kept inviting anything drawn there to be read as a muzzle.
# Cropping her to a circle fixed the proportion and the muzzle problem in one
# move.
#
# Attempt 1 filled 130 units and half its legibility problem was simply being
# small. Attempt 2 filled 220. This fills 234 vertically and 203 horizontally
# once the two side motes are counted. Fill the canvas.
#
# ----------------------------------------------------------------------------
# The eyes — the one thing that has worked every time
# ----------------------------------------------------------------------------
#
# `eye_l`, `eye_r`, `iris_*`, `pupil_*`, `glint_*` and `glint2_*` are carried
# across from attempt 2 **byte for byte**, and the bone chain is arranged so
# they land on their authored coordinates without a single number moving:
# `gaze` sits at (128, 150) and each eye bone is 54 units above it, which puts
# the eyes back at (101, 96) and (155, 96) exactly. They were solved twice.
# They are not to be "improved".
#
# What did change is what they sit in. There is no face behind them any more —
# they sit directly in the body of light, which is why she is a creature and
# not a person. Sizes at 96 px on screen: eye 16x19, iris 13x16, pupil 5x7,
# big catchlight 5 px, small catchlight 2.4 px. The pupil is deliberately
# small for its iris: a big pupil turns the eye into a dark hole at 96 px, and
# it is the *cyan* that has to survive the shrink.
#
# Both catchlights are upper-left in *both* eyes. Mirroring them would give
# her two light sources, and DESIGN.md allows one.
#
# Against a 154-unit-wide body the two eyes span 98 units — 64% of her width.
# That ratio is only possible because there is no face to fit them into, and
# it is most of why she is cute without one.
#
# ----------------------------------------------------------------------------
# Expression without a face
# ----------------------------------------------------------------------------
#
# She has no mouth to speak of and no eyebrows, which sounds like a limitation
# and is actually the feature: it forces every expression through channels
# that survive being small. The eight expressions are built from
#
#   - **eye shape and size** (`sy`, `sx` on `eye_l` / `eye_r`) — squeezed into
#     happy arcs, widened in alarm, drooped shut for sleep;
#   - **the two lights above her eyes** (`brow_l` / `brow_r`) — these are
#     *shapes of light*, small bright crescents floating in the glass, not
#     eyebrows drawn on a forehead. `ty` raises and drops them, `rot` tilts
#     them, and at 96 px they are 11x4 px, which is enough;
#   - **her overall squash and bounce** (`body` `ty`, `sx`, `sy`) — a
#     delighted wisp bounces and burns brighter, a sleepy one sags;
#   - **the tilt of the whole mass** (`head` `rot`) — there is no neck, so the
#     entire light tips over, which reads far more clearly than a head cock;
#   - **the trail's posture**, which follows all of the above for free through
#     the spring chains.
#
# The mouth is the one place uncanniness can creep back in, so it is rationed:
# a single tiny soft oval that **three of the eight expressions use at all**
# (delighted, sleepy, alarmed). The other five drive its bone `alpha` to 0 and
# it disappears outright — the rig folds bone alpha into shape opacity, which
# is a cleaner switch than collapsing it with scale, because a scaled-to-0.1
# oval still leaves a two-unit speck that is invisible at 96 px and a distinct
# dark dot at 384.
#
# ----------------------------------------------------------------------------
# Why she is legible on any wallpaper
# ----------------------------------------------------------------------------
#
# She is a light source, so she is drawn as one, and a light source is
# self-separating in a way a dark object is not. Four layers do it:
#
#   1. `aura`  — the wide violet bloom she sits in. Click-through (F2).
#   2. `halo`  — a tighter ring of violet glow that peaks *just outside* her
#      edge. This is what puts a soft violet corona between her and a light
#      wallpaper, where a bright rim alone would vanish.
#   3. the nested glass itself, which runs **bright in the middle and deeper
#      at the rim** — a lantern, not a ball. `shell` is the outer glass,
#      `body` is the brighter volume inside it, `core` is the violet heart and
#      `flame` is the cyan fire in the middle of that. Four nested values
#      means she has form at 512 px and still reads as one luminous blob at
#      48 px, which is the whole trick.
#   4. `edge` and the strokes on the trail — one hairline, bright white at
#      the upper left and deep violet at the lower right. The bright half
#      carries her on a dark wallpaper and the dark half carries her on a
#      white one. Neither alone is enough.
#
# Nothing in this file is near-black. Attempt 1 died of darkness; the darkest
# value here is the bottom-right end of the rim stroke, and it is a hairline.
#
# ----------------------------------------------------------------------------
# The trail — and the tail-chain naming contract
# ----------------------------------------------------------------------------
#
# The trail is what makes her a *wisp* rather than a glowing blob, and it is
# driven by the two spring chains that already existed and were already
# tested. **The tail count did not change — their arrangement did**, so the
# old contract is re-documented here rather than merely inherited:
#
#   OLD (attempt 2): the unsuffixed chain `tail1..3` was the twintail on
#   **screen right**, and `tail_l*` mirrored it on the left. That was a
#   left/right pair.
#
#   NEW: there are no twintails, because hair is a humanoid part. The two
#   chains are now **concentric and both hang straight down the centre line**:
#
#     `tail1..3`   (shapes `tail_a`, `tail_b`, `tail_c`)
#           the outer violet trail. Longer, wider, and the one that carries
#           clicks. This is still the chain the rig's secondary-motion test
#           measures.
#     `tail_l1..3` (shapes `tail_l_a`, `tail_l_b`, `tail_l_c`)
#           the cyan filament *inside* that trail. Shorter and thinner, and
#           it is the same fire as `flame` continuing out of her and down —
#           which is what ties the trail to the body instead of leaving it
#           looking stuck on.
#
# Both are centred on x = 128 at rest. That is deliberate and it is not only
# an aesthetic choice: the rig test measures |body_x - tail_b_x|, so a trail
# that hangs on the centre line has a resting gap of ~0 and *any* swing in
# *either* direction opens it. A trail parked off to one side can swing the
# wrong way and close the gap instead. Centre it.
#
# The two chains are tuned to slightly different stiffness on purpose, so the
# cyan filament lags the violet trail by a frame or two and the two slide
# against each other as she moves. That difference is most of what makes the
# trail look like fire rather than like a ribbon.
#
# Each trail shape is **ONE shape root-to-point, never segments.** Every shape
# strokes its whole boundary, so a chain split into overlapping segments draws
# a bright arc across itself at every join — a seam at 512 px and a bright bar
# cutting the tail in half at 96 px. `tail_a` is the entire trail, skinned
# across all three joints by distance; `_b` and `_c` are unstroked shading
# laid inside it.
#
# `mote_a`, `mote_b` and `mote_c` are the sparks the trail breaks into. They
# are detached from the body and they are what make the silhouette read as
# *dissipating* rather than as a pointed tail. They ride the lower trail bones
# so they swing late. They are 19, 15 and 11 units across — 7.1, 5.6 and
# 4.1 px at 96 — which clears the 2 px floor with room to spare.
#
# `mote_hand_l` and `mote_hand_r` are her hands: two motes of 22 and 24 units
# orbiting at her sides, on their own bones so clips can gesture with them. At
# 96 px they are 8.3 and 9 px, so they genuinely read, and they widen her
# occupied box from 154 units to 203.
#
# They sit at **different heights on purpose**. Two identical motes level with
# each other either side of a round head are ears, or handles bolted on; the
# same two at different heights are things floating near her, which is what
# they are.
#
# ----------------------------------------------------------------------------
# Why she is round, when docs/DESIGN.md says angular
# ----------------------------------------------------------------------------
#
# SPEC.md §3.5b: DESIGN.md's angular geometry rule (radii 3-6 px, no pills, no
# round blobs) governs *chrome* — bubbles, panels, menus, the rig editor. It
# does not govern the creature. An early revision obeyed the chrome rule
# literally and the result was the faceted crystal that read at 96 px as a
# smudge. Do not re-angularise her: there is not one straight edge in her
# artwork now, and there should not be. Everything else in DESIGN.md still
# applies:
#
#   - One light source, upper-left. Every linear gradient runs from around
#     (66, 24) towards (190, 168); every radial puts its focus above and left
#     of its centre.
#   - Light rides motion. `core`, `flame`, `spark` and `sheen` follow the
#     `light` bone, which the rig displaces against her travel, so the fire
#     inside her slides through the glass instead of flashing.
#   - Violet leads, cyan is light *inside* the material. The glass is violet
#     #7700ff and everything built on it; the cyan #00e5ff appears only as
#     fire in the middle of her, as the filament in her trail, and in her
#     irises. Cyan is never laid down as a flat surface colour anywhere in
#     this file — which is now a much more natural fit than it was when she
#     had hair to paint.
#
# ----------------------------------------------------------------------------
# Reading at 96 px
# ----------------------------------------------------------------------------
#
# The rule used throughout: nothing carries information unless it is at least
# 2 px wide at 96 px, which is 5.3 canvas units. Anything smaller is texture,
# and texture is only allowed to be the difference between "good at 512" and
# "better at 512" — never between "there" and "not there" at 96. The features
# that must survive the shrink are, in order:
#
#   1. the silhouette — a round mass with a trail falling off it into motes;
#   2. the two eyes, which are 64% of her width;
#   3. the cyan fire inside the violet glass, which is the only warm/cold
#      break she has and the thing that says "made of light";
#   4. the halo, which is what separates her from a pale wallpaper;
#   5. the two lights above her eyes, which are what make eight expressions
#      distinguishable now that there is no face.
#
# **Reviewing this file:** `examples/preview.rs` writes a 3x canvas. Rendering
# `size-256.svg` at 96 px shows you a 32 px version of her, which is a
# different and much more forgiving question, and it is how earlier attempts
# got validated against the wrong scale. The true-scale crop maths is in that
# file's doc comment. Use it.
#
# Canvas is 256x256 units and maps onto whatever pixel size the operator picks
# (F75, 48-512 px), so she is sharp on a 4K display at any size.

format = "nx-wisp-skin"
version = 1

[meta]
name = "Wisp"
author = "nerdrx"
license = "MIT"
summary = "A small floating spirit: violet glass, a cyan fire inside her, and a trail of light."
default_size_px = 128.0
min_size_px = 48.0
max_size_px = 512.0

[canvas]
size = [256.0, 256.0]
# She floats rather than stands, so the anchor is not a sole any more — it is
# the point of her the physics body tracks and the point that rests just above
# a title bar. It stays at (128, 228) because the review harness's true-scale
# crop is derived from 228/256 = 0.890625, and because it puts her round mass
# *above* whatever she is sitting on with the trail falling past it, which is
# what floating looks like.
anchor = [128.0, 228.0]

[physics]
gravity = 1500.0
drag = 0.75
restitution = 0.34
friction = 0.05
max_speed = 3600.0
rest_speed = 40.0
hard_landing_speed = 820.0
recovery_time_ms = 420.0
grab_transfer = 0.68

[motion]
# A soft round body made of light wants *more* squash than a chibi did, not
# less: she has no skeleton to justify holding her shape, and exaggeration is
# the only thing that sells weight in a creature with no limbs.
squash_bone = "body"
squash_gain = 0.0009
squash_max = 0.30
squash_deadzone = 10.0
lean_bone = "body"
lean_stiffness = 210.0
lean_damping_ratio = 0.52
lean_gain = 0.44
light_bone = "light"
light_gain = 0.024
light_range = 16.0

# --- palette ----------------------------------------------------------------
# The NX anchors, named once. DESIGN.md §1.

[[color]]
name = "violet"
value = "#7700ff"

[[color]]
name = "violet_soft"
value = "#9a3cff"

[[color]]
name = "cyan"
value = "#00e5ff"

[[color]]
name = "text"
value = "#efeaff"

[[color]]
name = "deep"
value = "#12091f"

# The eye rim. Dark enough to draw the eye's outline at 96 px, violet enough
# not to read as a hole punched in the light.
[[color]]
name = "lash"
value = "#2a1250"

[[color]]
name = "pupil"
value = "#150829"

# The mouth. A deep violet rather than a black, because it is a shadow *in
# light*, and a black oval on a glowing body reads as a puncture.
[[color]]
name = "mouth_dark"
value = "#2d0b57"

# --- gradients ---------------------------------------------------------------

# The wide bloom she sits in. Not part of the silhouette — you click through
# it (F2) — and the outermost of the four things that keep her legible on a
# pale wallpaper.
[[gradient]]
name = "aura"
kind = "radial"
center = [128.0, 128.0]
focus = [104.0, 100.0]
radius = 126.0
stop_at = [0.0, 0.44, 0.74, 1.0]
stop_color = ["#7700ff5c", "#7700ff2e", "#7700ff14", "#7700ff00"]

# The halo: a *ring* of glow rather than a disc. The stops put the peak at
# 0.72 of the radius, which is 81 units out — just past her 77-unit half
# width — so the brightest part of it sits immediately outside her edge and
# reads as light spilling off her. A radial with its peak at the centre would
# only wash out the fire inside her.
[[gradient]]
name = "halo"
kind = "radial"
center = [128.0, 110.0]
focus = [110.0, 90.0]
radius = 112.0
stop_at = [0.0, 0.46, 0.72, 1.0]
stop_color = ["#b06bff00", "#a558ff36", "#8a2bff5e", "#7700ff00"]

# Her outer glass. The name is historical — this is the top-lit body gradient
# the format's tests know by name — but it now lights *glass*, which is what
# it was originally for. Lit violet at the upper left, deep saturated violet
# at the lower right. Deep, never dark: the darkest stop here is still a
# clearly violet #6a1fd0, because attempt 1 died of darkness.
[[gradient]]
name = "glass_body"
kind = "linear"
start = [66.0, 24.0]
end = [190.0, 168.0]
stop_at = [0.0, 0.52, 1.0]
stop_color = ["#d8b6ff", "#9b4dff", "#6a1fd0"]

# The volume *inside* the glass — brighter than the shell everywhere, so the
# shell only ever shows as a rim and she reads as a lantern with something lit
# in it rather than as a violet ball.
[[gradient]]
name = "glass_deep"
kind = "linear"
start = [76.0, 46.0]
end = [180.0, 170.0]
stop_at = [0.0, 0.5, 1.0]
stop_color = ["#cba6ff", "#9b4dff", "#7a24e0"]

# The violet heart, low in her and burning up through the glass. Follows the
# light bone.
[[gradient]]
name = "core"
kind = "radial"
center = [128.0, 130.0]
focus = [112.0, 112.0]
radius = 62.0
follow_bone = "light"
stop_at = [0.0, 0.34, 0.72, 1.0]
stop_color = ["#e0b4ffb8", "#7700ff8c", "#7700ff38", "#7700ff00"]

# The cyan fire. This is the flame in the lantern and it is the single
# strongest "she is made of light" signal in the file.
#
# Getting it to read took four tries and every failure was the same failure:
# **any compact bright shape below two eyes is a muzzle.** A vertical lozenge
# under the eyes was a snout; a broad low pool was a bib; a tall column that
# reached her rim split her into a violet top and a blue bottom, because the
# eyes occlude the brightest, most central part of the glow and all that stays
# visible is the crescent underneath them.
#
# What works is a glow that is *centred behind the eyes* and *stops well short
# of her edge*: radius 60 against a 77-unit half width leaves a violet margin
# the whole way round. She reads as violet glass with a light in it, the light
# is clearly inside the material rather than painted on it, and there is no
# compact shape anywhere for the eye to promote into a facial feature.
[[gradient]]
name = "flame_core"
kind = "radial"
center = [128.0, 116.0]
focus = [116.0, 100.0]
radius = 60.0
follow_bone = "light"
stop_at = [0.0, 0.34, 0.7, 1.0]
stop_color = ["#d8feff5c", "#5eefff4a", "#00e5ff24", "#00e5ff00"]

# The hot nucleus of that fire — the light that actually *moves* inside her.
# Small, hot, offset up and left of the flame because there is one light in
# the room, and never a surface colour.
[[gradient]]
name = "spark"
kind = "radial"
center = [110.0, 130.0]
focus = [101.0, 121.0]
radius = 17.0
follow_bone = "light"
stop_at = [0.0, 0.32, 0.68, 1.0]
stop_color = ["#ffffffb4", "#00e5ff8c", "#00e5ff33", "#00e5ff00"]

# The light falling across the top of her. Kept under its old name because the
# format's tests check that it runs from the upper left; there are no facets
# left for it to fall on, only a curve.
[[gradient]]
name = "facet_light"
kind = "linear"
start = [72.0, 10.0]
end = [186.0, 98.0]
stop_at = [0.0, 0.5, 1.0]
stop_color = ["#ffffff5c", "#ffffff1f", "#ffffff00"]

# ...and the density that gathers at the bottom of the glass, where the light
# has furthest to travel out. Same light, other side. Violet, not grey: a grey
# shadow on a luminous body reads as dirt.
[[gradient]]
name = "facet_shadow"
kind = "linear"
start = [128.0, 96.0]
end = [128.0, 182.0]
stop_at = [0.0, 0.55, 1.0]
stop_color = ["#3d0a8000", "#3d0a801a", "#3d0a8047"]

# DESIGN.md's --edge-lit: white at the top left, then violet, then deep violet
# at the bottom right. This does more work here than anywhere else in the
# product — the bright half is what carries her on a dark wallpaper and the
# deep half is what carries her on a white one, and she needs both.
[[gradient]]
name = "edge_lit"
kind = "linear"
start = [62.0, 14.0]
end = [198.0, 194.0]
stop_at = [0.0, 0.32, 0.62, 1.0]
stop_color = ["#ffffffff", "#e9d2ffd6", "#a469ffb0", "#3a0b7ae0"]

# The specular band across the top of the glass. Bound to the light bone, so
# it is a function of where she is going — not a sweep fired on an event.
[[gradient]]
name = "sheen"
kind = "linear"
start = [72.0, 12.0]
end = [170.0, 96.0]
follow_bone = "light"
stop_at = [0.0, 0.4, 0.62, 1.0]
stop_color = ["#ffffff00", "#ffffff66", "#e6fbff3a", "#ffffff00"]

# --- the trail ---------------------------------------------------------------

# The outer violet trail. Fades as it falls so the trail *dissipates* instead
# of stopping — the alpha ramp is doing as much work as the hue is.
[[gradient]]
name = "trail"
kind = "linear"
start = [98.0, 140.0]
end = [158.0, 252.0]
stop_at = [0.0, 0.45, 0.8, 1.0]
stop_color = ["#c294ffee", "#9a4affcc", "#7326e08c", "#5a15b42a"]

# The brighter violet down the middle of that trail, so it has a lit core and
# a falloff rather than being a flat ribbon.
[[gradient]]
name = "trail_lit"
kind = "linear"
start = [110.0, 146.0]
end = [148.0, 250.0]
stop_at = [0.0, 0.5, 1.0]
stop_color = ["#e4c8ffcc", "#b478ff9e", "#8a3aee3d"]

# The cyan filament: the same fire as `flame`, continuing out of her and down.
[[gradient]]
name = "trail_core"
kind = "linear"
start = [114.0, 142.0]
end = [144.0, 230.0]
stop_at = [0.0, 0.42, 0.78, 1.0]
stop_color = ["#aef2ff70", "#4eecff4a", "#00e5ff24", "#00e5ff00"]

# ...and its white-hot centre, which only exists for the first third of it.
[[gradient]]
name = "trail_hot"
kind = "linear"
start = [118.0, 142.0]
end = [140.0, 208.0]
stop_at = [0.0, 0.55, 1.0]
stop_color = ["#ffffff6b", "#ddfdff33", "#00e5ff00"]

# The motes the trail breaks into, and her two hands.
#
# **One gradient each, centred on the mote it paints.** A radial gradient lives
# in *canvas* space, not shape space, so a single shared `mote` gradient
# centred at (128, 224) put every mote except one outside its own radius and
# they drew as nothing at all. Same trap as `iris_l` / `iris_r`, same fix.

[[gradient]]
name = "mote_a"
kind = "radial"
center = [152.0, 206.0]
focus = [147.0, 201.0]
radius = 11.0
stop_at = [0.0, 0.42, 0.78, 1.0]
stop_color = ["#f4e8ffee", "#bb84ffd6", "#7f2ff27a", "#7700ff00"]

[[gradient]]
name = "mote_b"
kind = "radial"
center = [102.0, 224.0]
focus = [98.0, 220.0]
radius = 9.0
stop_at = [0.0, 0.42, 0.78, 1.0]
stop_color = ["#f0e2ffdd", "#b478ffc4", "#7f2ff26e", "#7700ff00"]

[[gradient]]
name = "mote_c"
kind = "radial"
center = [146.0, 243.0]
focus = [143.0, 240.0]
radius = 7.0
stop_at = [0.0, 0.42, 0.78, 1.0]
