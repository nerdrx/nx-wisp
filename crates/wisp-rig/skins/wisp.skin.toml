# --- expression clips (F74) ----------------------------------------------------
# All additive, all on the `face` layer, so an expression rides whatever she is
# doing rather than replacing it.
#
# Every one of the eight moves at least three of {eyes, brows, mouth, head},
# because a single channel is a mood and three channels is a face. The brow
# offsets are the strongest signal at 96 px: `ty` raises or lowers, `rot` tilts
# the inner end, and those two together are most of human expression.

[[clip]]
name = "expr.neutral"
duration_ms = 2600.0
looping = true
additive = true

[[clip.track]]
bone = "brow_l"
channel = "ty"
t = [0.0, 1300.0, 2600.0]
v = [0.0, -0.8, 0.0]
ease = "soft"

[[clip.track]]
bone = "brow_r"
channel = "ty"
t = [0.0, 1300.0, 2600.0]
v = [0.0, -0.8, 0.0]
ease = "soft"

# No mouth in this expression. Eyes plus a mouth is a face, and a face at
# sprite scale is what attempt 2 died of, so only delighted, sleepy and
# alarmed open it. `alpha` is the honest channel for this: the rig folds
# bone alpha into shape opacity, so 0.0 is *gone*. Collapsing it with
# scale instead leaves a two-unit speck that is invisible at 96 px and a
# distinct dark dot at 384 — which is exactly the sort of thing that only
# shows up once she is on a 4K display.
[[clip.track]]
bone = "mouth"
channel = "alpha"
t = [0.0, 2600.0]
v = [0.0, 0.0]
ease = "soft"

[[clip]]
name = "expr.curious"
duration_ms = 2400.0
looping = true
additive = true

[[clip.track]]
