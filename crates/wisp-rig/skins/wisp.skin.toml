# Wisp — the default NX Wisp skin (F73, chibi brief, hair-and-outfit revision)
#
# A small round companion: an enormous head, a stubby body, long teal twintails
# and a school-uniform silhouette. She is meant to be *cute*, and she is meant
# to be read at 96 pixels — which is roughly the size of a browser favicon and
# the size she actually sits on a desktop.
#
# Everything here is data. There is no expression language in this format and
# no way for a skin to run code (SPEC.md §3.6).
#
# ----------------------------------------------------------------------------
# Proportion — the one decision that matters
# ----------------------------------------------------------------------------
#
# Cuteness in a small figure is almost entirely head-to-body ratio. Realistic
# is 1:7. "Chibi" is 1:2 or shorter, and F73 asks for the head to be 55-60% of
# total height. This file is built to that number and nothing else was allowed
# to push it around:
#
#     hair crown   y =   8   ─┐
#     face top     y =  24    │ head mass, crown to chin = 134 units
#     chin         y = 142   ─┘
#     lock tips    y = 162    │
#     skirt hem    y = 197    │ body, legs and boots = 86 units
#     sole         y = 228   ─┘
#                             total = 220 units, head = 60.9%
#
# Her face is 128 units wide (140 with the hair) against a 62-unit torso, so
# she is a sphere on a stub. The whole figure fills 220 of the canvas's 256
# units, which is deliberate: at 96 px on screen that makes her 82 px tall
# instead of the 49 px the original faceted design managed. Half the
# legibility win at 96 px is simply *occupying the canvas*.
#
# Eyes are 44 units wide each against a 128-unit face — 34% of face width per
# eye, and three quarters of the face given over to two eyes. That is the
# anime-chibi ratio, and at 96 px it makes each eye a legible 16 px object with
# room inside it for an iris, a pupil and two catchlights. The eyes are the one
# part of her nobody is allowed to "improve": they were solved, and a bigger
# pupil turns each eye into a hole at 96 px.
#
# ----------------------------------------------------------------------------
# Why she stopped looking like an astronaut
# ----------------------------------------------------------------------------
#
# The revision before this one drew her hair as a single smooth cyan dome with
# the pale face inset inside it. That silhouette is a space helmet with a
# visor, and the operator said so. Two things caused it and both are fixed
# here:
#
#   1. **The fringe had no edge.** Hair only reads as hair when its boundary is
#      broken. `hair_front` is now two big swept locks meeting at a narrow
#      parting, with six strand tips hanging off their hem — the outermost pair
#      reaching y = 90, right down beside her eyes. That is 13 px of broken
#      boundary at 96. A smooth arc there is a visor; a broken one is a fringe.
#      Getting the *shape* of the break right took three tries; see the note on
#      `hair_front`, because two of the obvious answers look worse than the
#      helmet did.
#   2. **The hair enclosed the face instead of framing it.** A helmet encloses.
#      Hair frames. The fringe now covers the upper third of the face and stops
#      — the cheeks, the mouth and the chin are bare skin — and `lock_l` /
#      `lock_r` hang past the jaw to points at y = 162, twenty units *below*
#      the chin, so the head's outline is broken at the bottom corners rather
#      than closing into a circle. `hair_back` carries four spiked tips at
#      y = 158-160 for the same reason. If the head's outline ever becomes a
#      smooth closed curve again, the astronaut is back.
#
# The hair also stopped being brand cyan. `#00e5ff` at full saturation across a
# whole dome is a painted helmet; a lighter desaturated seafoam reads as hair
# and lets the face — now a warm skin tone rather than lavender-white — sit in
# front of it as a separate object. Cyan survives where it belongs: in her
# irises, in the mote inside her chest, and in the rim light.
#
# The twintails used to be rooted beside her jaw, which is where an animal's
# ears are, and they hung in two even lobes, which is what an animal's ears do.
# They are now tied at the top corners of her skull at y = 30 — above the
# temples, at the crown — with a rectangular maroon tie at each root, and each
# tail is five units wide under its tie, swells to 33 through the middle and
# comes to an actual point at y = 224. Even lobes are ears; narrow-fat-point is
# a tail.
#
# The old fix was a 16-unit gap held open beside the head. That gap still
# exists and it is still doing the work, but it has moved: each tail's inner
# edge bows outward so the notch opens 6 units under the tie, 10 by y = 80 and
# 16 by the jaw, and the tail is 30 units clear of her arm at y = 178. Without
# that bow the head and the two tails union into one smooth dome across the top
# of the silhouette, and a smooth dome is the astronaut whatever is painted
# inside it.
#
# ----------------------------------------------------------------------------
# Why she is round, when docs/DESIGN.md says angular
# ----------------------------------------------------------------------------
#
# SPEC.md §3.5b: DESIGN.md's angular geometry rule (radii 3-6 px, no pills, no
# round blobs) governs *chrome* — bubbles, panels, menus, the rig editor. It
# does not govern the creature. A chibi is round by definition; an early
# revision of this file obeyed the chrome rule literally, and the result was a
# dark faceted crystal that read at 96 px as a smudge. Do not re-angularise
# her. The straight lines that do appear — the strand tips, the hair ties, the
# pleats — are hair and cloth, not facets. Everything else in DESIGN.md still
# applies:
#
#   - One light source, upper-left. Every linear gradient runs from around
#     (74, 40) towards (182, 160); every radial puts its focus above and left
#     of its centre. Both catchlights sit upper-left in *both* eyes — they are
#     not mirrored, because there is only one light in the room.
#   - Light rides motion. `core`, `spark` and `sheen` follow the `light` bone,
#     which the rig displaces against her travel, so the highlight slides
#     through her instead of flashing.
#   - Violet leads. Her necktie is NX violet #7700ff, her heart glows #7700ff
#     through the jacket, and the bloom she sits in is #7700ff. The reference
#     character wears a teal tie; violet gives the brand a home now that the
#     hair has gone teal, and the silhouette is identical either way. Cyan is
#     never laid down as a flat surface colour anywhere in this file.
#
# ----------------------------------------------------------------------------
# The outfit
# ----------------------------------------------------------------------------
#
# Half of "she looks like a spacesuit" was that she was not wearing anything —
# a violet sack with a cyan band at the neck. She now wears the standard
# chibi-idol uniform, sized so every piece clears the 2 px floor at 96:
#
#     collar                  white, 52 units across    20 px
#     shirt, in the collar V  white, 24 units wide       9 px
#     necktie                 #7700ff, 20 units wide      7 px
#     sleeveless jacket       near-black violet    the torso silhouette
#     pleated skirt           darker, 84 at the hem     31 px
#     bare arms and thighs    skin, so the dark reads as clothing
#     thigh boots + trim      dark with a lilac band    3.4 px of band
#
# The bare gap of thigh between the skirt hem (197) and the boot band (204) is
# only seven units, but it is the difference between "boots" and "the bottom of
# a dress". The white is rationed on purpose: a wide white panel across the
# chest reads as an apron at 96 px, so the collar carries it and the shirt only
# shows in the V.
#
# ----------------------------------------------------------------------------
# Reading at 96 px
# ----------------------------------------------------------------------------
#
# The rule used throughout: nothing carries information unless it is at least
# 2 px wide at 96 px, which is 5.3 canvas units. Anything smaller is texture,
# and texture is only allowed to be the difference between "good at 512" and
# "better at 512" — never between "there" and "not there" at 96. The features
# that must survive the shrink are, in order:
#
#   1. the silhouette — a big head with a broken hair outline, two long tails
#      tied high, a stub of a body;
#   2. the two eyes, and the bright rim that separates her from the wallpaper;
#   3. the teal hair against the warm face and the near-black uniform;
#   4. the violet tie, which is the brand and the only warm-cold break below
#      her chin;
#   5. brows and mouth, which is what makes eight expressions distinguishable.
#
# Canvas is 256x256 units and maps onto whatever pixel size the operator picks
# (F75, 48-512 px), so she is sharp on a 4K display at any size.

format = "nx-wisp-skin"
version = 1

[meta]
name = "Wisp"
author = "nerdrx"
license = "MIT"
summary = "A round little companion with a huge head, cyan twin tails and a violet dress."
default_size_px = 128.0
min_size_px = 48.0
max_size_px = 512.0

[canvas]
size = [256.0, 256.0]
# She stands, so the anchor is the sole of her feet — that is what rests on a
# title bar and what the physics body tracks.
anchor = [128.0, 228.0]

[physics]
gravity = 1500.0
drag = 0.75
restitution = 0.34
friction = 0.05
max_speed = 3600.0
rest_speed = 40.0
hard_landing_speed = 820.0
recovery_time_ms = 420.0
grab_transfer = 0.68

[motion]
# A big head on a small body wants more squash than a crystal did: exaggeration
# is what sells weight in a chibi.
squash_bone = "body"
squash_gain = 0.0008
squash_max = 0.28
squash_deadzone = 10.0
lean_bone = "body"
lean_stiffness = 210.0
lean_damping_ratio = 0.52
lean_gain = 0.44
light_bone = "light"
light_gain = 0.024
light_range = 16.0

# --- palette ----------------------------------------------------------------
# The NX anchors, named once. DESIGN.md §1.

[[color]]
name = "violet"
value = "#7700ff"

[[color]]
name = "violet_soft"
value = "#9a3cff"

[[color]]
name = "cyan"
value = "#00e5ff"

[[color]]
name = "text"
value = "#efeaff"

[[color]]
name = "deep"
value = "#12091f"

# The eye rim. Dark enough to draw the eye's outline at 96 px, violet enough
# not to read as a hole punched in her face.
[[color]]
name = "lash"
value = "#2a1250"

[[color]]
name = "pupil"
value = "#150829"

# The band across each hair tie. Grey-silver, and the only neutral in the file:
# it is what stops the tie reading as a red smudge at 96 px.
[[color]]
name = "silver"
value = "#cdc6dc"

# --- gradients ---------------------------------------------------------------

# The violet bloom she sits in. Not part of the silhouette — you click through
# it (F2) — and the thing that separates her from a *light* wallpaper, where a
# bright rim alone would disappear.
[[gradient]]
name = "aura"
kind = "radial"
center = [128.0, 128.0]
focus = [104.0, 100.0]
radius = 120.0
stop_at = [0.0, 0.44, 0.74, 1.0]
stop_color = ["#7700ff4a", "#7700ff26", "#7700ff10", "#7700ff00"]

# Her face. The name is historical — this is the top-lit body gradient the
# format's tests know by name — but it now lights *skin*. Warm and pale: the
# previous lavender-white made the face read as a visor behind glass, because
# a cold face under cold hair is one material. Skin has to be a different
# temperature from the hair or the hair cannot sit in front of it.
[[gradient]]
name = "glass_body"
kind = "linear"
start = [74.0, 40.0]
end = [182.0, 160.0]
stop_at = [0.0, 0.52, 1.0]
stop_color = ["#fff5ed", "#ffe4d6", "#efc2ad"]

# Her arms and thighs. Same skin, lit for where they actually are — a gradient
# lives in canvas space, so a limb down at y = 200 needs its own ramp or it
# takes the face's shadow end and goes muddy.
[[gradient]]
name = "skin_limb"
kind = "linear"
start = [86.0, 140.0]
end = [176.0, 216.0]
stop_at = [0.0, 0.5, 1.0]
stop_color = ["#fff1e8", "#ffdece", "#e9b9a3"]

# Her hair and the twintails. A *desaturated seafoam*, not brand cyan: cyan at
# full chroma across a whole head is a painted helmet, and it flattens into one
# opaque shape at 96 px. Lit at the crown, seafoam through the middle and deep
# teal in shadow, so the mass has form.
[[gradient]]
name = "hair"
kind = "linear"
start = [62.0, 6.0]
end = [206.0, 164.0]
stop_at = [0.0, 0.3, 0.68, 1.0]
stop_color = ["#a4e7da", "#71cfc2", "#449991", "#28636a"]

# The shine that runs down the outside of each tail and across the fringe.
[[gradient]]
name = "hair_lit"
kind = "linear"
start = [40.0, 20.0]
end = [232.0, 200.0]
stop_at = [0.0, 0.5, 1.0]
stop_color = ["#f0fffc", "#b6f0e4", "#84d8cd"]

# The tails. Same material as the hair, running out along their length and
# darkening as they leave her, so the pair have depth against the head.
[[gradient]]
name = "tail_glow"
kind = "linear"
start = [40.0, 8.0]
end = [252.0, 196.0]
stop_at = [0.0, 0.3, 0.66, 1.0]
stop_color = ["#95dccf", "#5cb9ae", "#358a88", "#1f545d"]

# The shadow down the inner edge of each tail, where it turns away from the
# light and towards her head. Ten units of it, which is 3.7 px — enough to give
# the tail a near side and a far side instead of reading as a flat cut-out.
[[gradient]]
name = "tail_shade"
kind = "linear"
start = [40.0, 40.0]
end = [232.0, 220.0]
stop_at = [0.0, 0.5, 1.0]
stop_color = ["#1b5460", "#256a75", "#2f7f88"]

# The sleeveless jacket. Near-black, but a *violet* near-black — nothing in
# this file is neutral except the tie band.
[[gradient]]
name = "jacket"
kind = "linear"
start = [96.0, 132.0]
end = [164.0, 196.0]
stop_at = [0.0, 0.45, 1.0]
stop_color = ["#544678", "#2e2549", "#170f28"]

# The skirt, and the boots. One step darker than the jacket so the two read as
# separate garments at 96 px rather than as one dark mass.
[[gradient]]
name = "skirt"
kind = "linear"
start = [84.0, 168.0]
end = [174.0, 208.0]
stop_at = [0.0, 0.45, 1.0]
stop_color = ["#5b4d82", "#352a53", "#1d1433"]

[[gradient]]
name = "boot"
kind = "linear"
start = [98.0, 198.0]
end = [158.0, 228.0]
stop_at = [0.0, 0.45, 1.0]
stop_color = ["#3d3159", "#221a39", "#110c1f"]

# The band round the top of each boot, and the same lilac used for the pleats.
[[gradient]]
name = "trim"
kind = "linear"
start = [98.0, 196.0]
end = [158.0, 214.0]
stop_at = [0.0, 1.0]
stop_color = ["#c3b8e4", "#8879bb"]

# The shirt under the jacket, and the collar.
[[gradient]]
name = "shirt"
kind = "linear"
start = [104.0, 142.0]
end = [154.0, 190.0]
stop_at = [0.0, 0.5, 1.0]
stop_color = ["#ffffff", "#f1ecfc", "#cfc4ea"]

# The necktie. NX violet, lit from the same corner as everything else. This is
# where the brand lives now that the hair is teal.
[[gradient]]
name = "dress"
kind = "linear"
start = [116.0, 150.0]
end = [140.0, 202.0]
stop_at = [0.0, 0.42, 1.0]
stop_color = ["#b478ff", "#7700ff", "#42088f"]

# The hair ties. Dark maroon, the single most iconic cue the reference
# character has, and the reason two teal shapes beside her head read as
# *twintails* rather than as ears.
[[gradient]]
name = "hairtie"
kind = "linear"
start = [60.0, 20.0]
end = [200.0, 56.0]
stop_at = [0.0, 0.5, 1.0]
stop_color = ["#a83b52", "#7c2437", "#4e1526"]

# The violet heart, glowing out through the jacket. Follows the light bone.
[[gradient]]
name = "core"
kind = "radial"
center = [128.0, 166.0]
focus = [112.0, 150.0]
radius = 38.0
follow_bone = "light"
stop_at = [0.0, 0.34, 0.72, 1.0]
stop_color = ["#c187ff8c", "#7700ff66", "#7700ff26", "#7700ff00"]

# The cyan mote — the light that moves *inside* her. Small, hot, and never a
# surface colour.
[[gradient]]
name = "spark"
kind = "radial"
center = [114.0, 166.0]
focus = [106.0, 158.0]
radius = 15.0
follow_bone = "light"
stop_at = [0.0, 0.32, 0.68, 1.0]
stop_color = ["#e6fcffcc", "#00e5ff99", "#00e5ff33", "#00e5ff00"]

# The light falling across the crown of her head. Kept under its old name
# because the format's tests check that it runs from the upper left; there are
# no facets left for it to fall on, only a curve.
[[gradient]]
name = "facet_light"
kind = "linear"
start = [78.0, 12.0]
end = [180.0, 96.0]
stop_at = [0.0, 0.5, 1.0]
stop_color = ["#ffffff4d", "#ffffff1a", "#ffffff00"]

# ...and the shadow the fringe and the chin cast downwards. Same light, other
# side. This is what stops the face reading as a flat disc, and it is warm now
# because it falls on skin.
[[gradient]]
name = "facet_shadow"
kind = "linear"
start = [128.0, 84.0]
end = [128.0, 150.0]
stop_at = [0.0, 0.55, 1.0]
stop_color = ["#6b2f4a00", "#6b2f4a12", "#6b2f4a3a"]

# DESIGN.md's --edge-lit: bright top-left, warm, a breath of seafoam, then
# dark. On a chibi this does more work than on anything else in the product —
# it is the whole reason she survives being dropped on a white window or a
# photo wallpaper.
[[gradient]]
name = "edge_lit"
kind = "linear"
start = [66.0, 16.0]
end = [196.0, 200.0]
stop_at = [0.0, 0.32, 0.62, 1.0]
stop_color = ["#ffffffff", "#ffeadccc", "#9ceee0a8", "#2a0a4a8c"]

# The specular band on the crown. Bound to the light bone, so it is a function
# of where she is going — not a sweep fired on an event.
[[gradient]]
name = "sheen"
kind = "linear"
start = [76.0, 14.0]
end = [166.0, 92.0]
follow_bone = "light"
stop_at = [0.0, 0.4, 0.62, 1.0]
stop_color = ["#ffffff00", "#ffffff52", "#d6fff62e", "#ffffff00"]

# The irises. One gradient per eye, because a gradient lives in canvas space
# and a single shared one would light the two eyes differently. Hot white-cyan
# at the top-left, brand cyan through the middle, deep blue at the bottom —
# that vertical ramp is what makes a flat disc read as a glassy sphere. This is
# where NX cyan lives now, and it is the reason the eyes are the first thing
# you see at 96 px.
[[gradient]]
name = "iris_l"
kind = "radial"
center = [101.0, 99.0]
focus = [94.0, 88.0]
radius = 22.0
stop_at = [0.0, 0.5, 0.86, 1.0]
stop_color = ["#eafeff", "#35ecff", "#0aa8e2", "#0d6cc0"]

[[gradient]]
name = "iris_r"
kind = "radial"
center = [155.0, 99.0]
focus = [148.0, 88.0]
radius = 22.0
stop_at = [0.0, 0.5, 0.86, 1.0]
stop_color = ["#eafeff", "#35ecff", "#0aa8e2", "#0d6cc0"]

# Blush. Warm pink on warm skin, so it is a flush rather than a sticker — it
# was two hot magenta dabs when the face was lavender, and it has to come down
# now that the face is not.
[[gradient]]
name = "blush_l"
kind = "radial"
center = [84.0, 124.0]
focus = [79.0, 119.0]
radius = 16.0
stop_at = [0.0, 0.55, 1.0]
stop_color = ["#ff8296b4", "#ff829670", "#ff829600"]

[[gradient]]
name = "blush_r"
kind = "radial"
center = [172.0, 124.0]
focus = [167.0, 119.0]
radius = 16.0
stop_at = [0.0, 0.55, 1.0]
stop_color = ["#ff8296b4", "#ff829670", "#ff829600"]

# --- skeleton ----------------------------------------------------------------
#
#   root ── body ─┬─ head ─┬─ gaze ─┬─ eye_l
#                 │        │        └─ eye_r
#                 │        ├─ brow_l
#                 │        ├─ brow_r
#                 │        ├─ mouth
#                 │        ├─ tail1   ── tail2   ── tail3      (screen right)
#                 │        └─ tail_l1 ── tail_l2 ── tail_l3    (screen left)
#                 └─ light
#
# `gaze` exists so the look-at constraint has a bone of its own: an IK
# constraint owns the rotation channel it writes, so authored head motion goes
# on `head` and the two compose instead of fighting.
#
# It pivots *below* the eyes, down at the chin, not between them. A pivot
# between the eyes only tilts them; a pivot behind and beneath them swings them
# sideways across the face, which is what reads as looking rather than as a
# head tilt.
#
# The tails hang off `head`, not off `body`, because they are hair: when she
# tilts her head they swing, and the spring chains then make them arrive late.

[[bone]]
name = "root"
pos = [128.0, 228.0]

[[bone]]
name = "body"
parent = "root"
pos = [0.0, -62.0]
length = 46.0

[[bone]]
name = "head"
parent = "body"
pos = [0.0, -56.0]
length = 60.0

[[bone]]
name = "gaze"
parent = "head"
pos = [0.0, 40.0]
length = 40.0

# The eyes sit 54 units above the gaze pivot, which puts them back at their
# authored positions (101, 96) and (155, 96).
[[bone]]
name = "eye_l"
parent = "gaze"
pos = [-27.0, -54.0]
length = 22.0

[[bone]]
name = "eye_r"
parent = "gaze"
pos = [27.0, -54.0]
length = 22.0

# Brows are the cheapest expression channel there is: two 26x7 dashes that a
# clip can raise, drop and tilt. At 96 px they are 10x3 px, which is the
# smallest thing in this file that still carries meaning.
[[bone]]
name = "brow_l"
parent = "head"
pos = [-27.0, -43.0]
length = 14.0

[[bone]]
name = "brow_r"
parent = "head"
pos = [27.0, -43.0]
length = 14.0

# The mouth is a scale channel, not a shape library: one small oval that clips
# stretch open, squash flat, or widen into a smirk.
[[bone]]
name = "mouth"
parent = "head"
pos = [0.0, 23.0]
length = 10.0

# The internal light. Nothing is parented to it; the gradients follow it.
[[bone]]
name = "light"
parent = "body"
pos = [-14.0, 8.0]
length = 10.0

# The twintails. Bones point along their own +x. The roots sit at (74, 38) and
# (178, 30) — the top corners of her skull, above the temples and just inside
# the crown — because that is where a tie goes and because a tail that leaves
# the head beside the jaw is an ear.
#
# The first joint leaves at 50 deg and is the longest of the three, which is
# what carries the tail *clear of her cheek* before it turns down: by y = 84
# the centreline is at x = 223 against a head that stops at 198. The two joints
# after it straighten towards vertical so the tail falls rather than sticks
# out, and the last one is long and slow so the taper has somewhere to go.
#
# The artwork keeps the tail *narrow* for the first fifty units below the tie
# and puts its bulk at y = 100-150, which is the fix for the other half of the
# blob problem: a tail that is already fat at y = 40 fuses with the crown into
# one wide dome, and a wide smooth dome is the silhouette of a helmet no matter
# what is painted on it.
#
# Naming: the unsuffixed chain — `tail1..3`, shapes `tail_a/b/c`, chain "tail"
# — is the tail on **screen right**; `tail_l*` mirrors it on the left. The two
# are not interchangeable. Whichever way she travels, both tails swing the same
# way relative to her head, so the gap between her body and the *downwind* tail
# opens while the upwind one closes; the rig's secondary-motion test measures
# the unsuffixed one, and it is the tail that opens.
[[bone]]
name = "tail_l1"
parent = "head"
pos = [-50.0, -80.0]
rot = 130.0
length = 70.0

[[bone]]
name = "tail_l2"
parent = "tail_l1"
pos = [70.0, 0.0]
rot = -35.0
length = 56.0

[[bone]]
name = "tail_l3"
parent = "tail_l2"
pos = [56.0, 0.0]
rot = -5.0
length = 76.0

[[bone]]
name = "tail1"
parent = "head"
pos = [50.0, -80.0]
rot = 50.0
length = 70.0

[[bone]]
name = "tail2"
parent = "tail1"
pos = [70.0, 0.0]
rot = 35.0
length = 56.0

[[bone]]
name = "tail3"
parent = "tail2"
pos = [56.0, 0.0]
rot = 5.0
length = 76.0

# --- artwork -----------------------------------------------------------------
# Drawn back to front by `z`. The order is: bloom, tails, back hair, limbs and
# uniform, face, eyes, front hair, ties, brows, sheen, lit edge.

# The bloom. Bound to `root` rather than `body` so it stays put while she leans
# — a small parallax that makes her read as being in front of her own glow.
[[shape]]
name = "aura"
z = 0
silhouette = false
path = "M 128 8 C 194 8, 248 62, 248 128 C 248 194, 194 248, 128 248 C 62 248, 8 194, 8 128 C 8 62, 62 8, 128 8 Z"
bind = "root"
fill = { gradient = "aura" }

# --- the twintails ----------------------------------------------------------
# One outline per tail, root to point, and it is one shape rather than three
# for a reason: every shape carries the lit edge as a stroke round its *whole*
# boundary, so a tail split into overlapping segments draws a bright arc across
# itself at each join. At 512 px that is a seam; at 96 px it is a bright line
# cutting the tail in half. `tail_a` is therefore the whole tail, skinned
# across all three joints by distance, and `_b` and `_c` are unstroked shading
# laid inside it.
#
# The profile is the second half of the ear fix. An ear is even along its
# length. A tail is *narrow at the tie* — five units at y = 40, hidden under
# the tie itself — swells to 36 units through the middle, and comes to an
# actual point at y = 224. Keeping it thin up top is what stops the pair fusing
# with the crown into one wide dome, and a wide smooth dome is the silhouette
# of a helmet no matter what is painted on it.
#
# The inner edge bows outward on purpose: it clears the head by 6 units at
# y = 60, 10 at y = 80 and 16 by y = 140, so the notch opens from just under
# the tie rather than only at the jaw. It is 30 units clear of her arm at
# y = 178. Without that bow the head and the two tails union into a single
# smooth dome across the top of the silhouette, which is the astronaut again.
#
# They are painted from `tail_glow`, which is a step darker than `hair`. Two
# masses of identical colour either side of a head fuse into one blob at 96 px
# no matter how much geometry sits between them; half a stop of value is what
# actually separates them.
#
# The right tail is drawn first and the left over it, which gives the pair a
# little depth ordering at no cost.

[[shape]]
name = "tail_a"
z = 2
silhouette = true
path = """
M 180 28
C 199 28, 217 48, 229 76
C 239 100, 244 124, 243 156
C 241 186, 236 206, 228 224
C 220 204, 211 180, 209 152
C 210 120, 210 78, 186 50
Z"""
bind_auto = { bones = ["tail1", "tail2", "tail3"], falloff = 70.0, power = 2.0 }
fill = { gradient = "tail_glow" }
stroke = { gradient = "edge_lit", width = 2.2, alpha = 0.9, join = "round" }

