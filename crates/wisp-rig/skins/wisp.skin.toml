# --- the trail ---------------------------------------------------------------
# One shape root-to-point per strand, never segments — see the note at the top
# of the file. `tail_a` is the whole outer trail, skinned across all three of
# its joints by distance; everything after it is unstroked shading laid inside
# it.
#
# The trail leaves her at 52 units wide where it passes under the body and
# tapers to y = 238. The top 30 units of it are hidden behind the glass, which
# is what makes it read as *coming out of her* rather than as being glued to
# her underside.
#
# **It is curved and asymmetric, and that is the whole point.** A symmetric
# straight taper hanging off a circle is an ice-cream drip at 384 px and a map
# pin at 96 — which is exactly what the first pass of this attempt produced,
# and the pin read is strong enough to survive being cute. A real wisp-trail
# leans off to one side and bends back under itself. This one's centreline
# drifts right through the middle and comes back left at the tip, and the
# spring chain then exaggerates that in both directions as she moves.
#
# The tip fades rather than ending: the fill's last stop is 16% alpha and the
# lit edge is dropped to 0.45 along the trail, so the trail dissolves into the
# motes instead of terminating in a hard dagger point. The body's own `edge`
# carries the job of separating her from a pale wallpaper — the trail does not
# need to, and hardening its outline to help only made it look like a spike.
#
# **Winding matters, and it is not obvious.** `contour::trace` rasterises the
# union of every `silhouette = true` shape with a **non-zero winding** fill, so
# two overlapping silhouette shapes only union if they wind the *same way*.
# Wind one of them backwards and the overlap cancels to a hole — and because
# the trail overlaps the body by 30 units, that hole is a bite taken out of
# her middle, not a cosmetic seam. It costs nothing to draw and it makes her
# own body unclickable, which reads as a bug rather than as a skin mistake.
#
# Every closed path in this file therefore winds the same way: **clockwise in
# canvas space, which is y-down — top, then right, then bottom, then left.**
# `tail_a` reads bottom-first because it starts at its top *right* corner, and
# that is deliberate. If you redraw a trail strand from its top left, reverse
# it before you save.

[[shape]]
name = "tail_a"
z = 4
silhouette = true
path = """
M 154 138
C 159 160, 157 184, 148 206
C 143 219, 136 231, 130 238
C 128 233, 124 224, 120 214
C 112 194, 104 166, 102 138
Z"""
bind_auto = { bones = ["tail1", "tail2", "tail3"], falloff = 62.0, power = 2.0 }
fill = { gradient = "trail" }
stroke = { gradient = "edge_lit", width = 1.8, alpha = 0.45, join = "round" }

