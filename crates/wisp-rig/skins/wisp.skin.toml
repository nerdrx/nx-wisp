# --- constraints ----------------------------------------------------------------

# F69: her eyes track the cursor. A narrow cone, because a mote of glass that
# swivels 90 degrees reads as a turret, not as attention.
[[ik]]
name = "gaze"
kind = "look_at"
bone = "gaze"
target = "cursor"
forward = [0.0, -1.0]
max_deg = 18.0
weight = 0.85

# Available for scripted reaching — wrapping the tail round a window edge
# (F68). Nothing drives it by default, so the spring chain below owns the tail.
[[ik]]
name = "tail_reach"
kind = "two_bone"
root = "tail1"
mid = "tail2"
end = "tail3"
target = "none"
bend_positive = true

# F67's secondary motion: the tail arrives late and keeps going after she
# stops. Light and draggy, because a wisp-trail is nearly weightless.
[[chain]]
name = "tail"
bones = ["tail1", "tail2", "tail3"]
stiffness = 130.0
damping = 15.0
mass = 1.0
gravity = 40.0
drag = 1.4
stiff_length = 1.0
