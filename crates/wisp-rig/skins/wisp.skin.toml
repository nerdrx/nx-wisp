# --- the lights above her eyes -----------------------------------------------
# These are *not* eyebrows. There is no forehead for an eyebrow to sit on.
# They are two small bright crescents of light floating in the glass above each
# eye — the honest version of a raised brow for a creature made of light.
#
# At 96 px they are 11x4 px, which is the smallest thing in this file that
# still carries meaning, and they are the channel that makes eight expressions
# distinguishable now that there is no face to work with.

[[shape]]
name = "brow_l"
z = 36
opacity = 0.85
silhouette = false
path = """
M 87 71
C 90 63, 96 59, 102 59
C 108 59, 113 62, 116 68
C 112 63, 107 62, 102 62
C 96 62, 91 65, 87 71
Z"""
bind = "brow_l"
fill = { gradient = "browlight" }

[[shape]]
name = "brow_r"
z = 36
opacity = 0.85
silhouette = false
path = """
M 141 71
C 144 63, 150 59, 156 59
C 162 59, 167 62, 170 68
C 166 63, 161 62, 156 62
C 150 62, 145 65, 141 71
Z"""
bind = "brow_r"
fill = { gradient = "browlight" }

# --- her hands ---------------------------------------------------------------
# Two motes orbiting at her sides, on their own bones so a clip can gesture
# with them. 22 and 24 units across, which is 8.3 and 9 px at 96 — they
# genuinely read, and they are what widens her occupied box from 154 to 203.
#
# Different heights on purpose: level with each other they are ears.
#
# Click-through: reaching for a mote and having the window take the click
# would be worse than not being able to grab them at all.

[[shape]]
name = "mote_hand_l"
z = 38
opacity = 0.95
silhouette = false
path = """
M 40 135
C 46.08 135, 51 139.92, 51 146
C 51 152.08, 46.08 157, 40 157
C 33.92 157, 29 152.08, 29 146
C 29 139.92, 33.92 135, 40 135
Z"""
bind = "mote_l"
fill = { gradient = "mote_hand_l" }

[[shape]]
name = "mote_hand_r"
z = 38
opacity = 0.95
silhouette = false
path = """
M 220 116
C 226.63 116, 232 121.37, 232 128
C 232 134.63, 226.63 140, 220 140
C 213.37 140, 208 134.63, 208 128
C 208 121.37, 213.37 116, 220 116
Z"""
bind = "mote_r"
fill = { gradient = "mote_hand_r" }

# --- the lit rim --------------------------------------------------------------
# One hairline of gradient border round the glass, drawn last so nothing
# covers it. It traces `shell` exactly. The trail carries the same stroke on
# its own shape, and between them they are what separate her from any
# wallpaper: white at the upper left for dark backgrounds, deep violet at the
# lower right for pale ones.

[[shape]]
name = "edge"
z = 44
silhouette = false
path = """
M 128 14
C 170 14, 203 45, 204 87
C 205 134, 176 168, 128 168
C 80 168, 51 134, 52 87
C 53 45, 86 14, 128 14
Z"""
bind = "head"
stroke = { gradient = "edge_lit", width = 2.8, join = "round" }
# --- animation layers ---------------------------------------------------------
# Evaluated in order. The base layer carries where she is and what she is
# doing; the three additive layers on top are what stop her ever freezing
# (F70) — she breathes and blinks while she walks.

[[layer]]
name = "base"
additive = false
default_clip = "idle"

[[layer]]
name = "breathe"
additive = true
default_clip = "breathe"

[[layer]]
name = "blink"
additive = true
default_clip = "blink"

[[layer]]
name = "face"
additive = true
default_clip = "expr.neutral"

