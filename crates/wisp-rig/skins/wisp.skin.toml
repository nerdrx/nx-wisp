# --- constraints ----------------------------------------------------------------

# F69: her eyes track the cursor. Still a narrow cone — a companion that
# swivels 90 degrees reads as a turret, not as attention — but the eyes sit 54
# units above the pivot, so 16 degrees slides them 15 units across a 154-unit
# body. That is a glance you can see at 96 px, and it is as far as the cone
# can open before an eye starts to leave her edge.
[[ik]]
name = "gaze"
kind = "look_at"
bone = "gaze"
target = "cursor"
forward = [0.0, -1.0]
max_deg = 16.0
weight = 0.85

# Available for scripted reaching — curling the trail round a window edge
# (F68). Nothing drives it by default, so the spring chains below own it.
[[ik]]
name = "tail_reach"
kind = "two_bone"
root = "tail_l1"
mid = "tail_l2"
end = "tail_l3"
target = "none"
bend_positive = true

# F67's secondary motion, and the reason she reads as floating rather than as
# a sticker: the trail arrives late and keeps going after she stops.
#
# The two chains are deliberately tuned *differently*. The outer violet trail
# is the heavier of the two; the inner cyan filament is softer, draggier and
# a little heavier in gravity, so it lags the trail it lives inside by a frame
# or two and the two slide against each other as she moves. That difference is
# most of what makes the trail look like fire rather than like a ribbon — a
# single chain, however well tuned, always reads as one solid object swinging.
#
# Both are light and draggy. This is smoke, not rope.
[[chain]]
name = "tail"
bones = ["tail1", "tail2", "tail3"]
stiffness = 138.0
damping = 13.0
mass = 1.0
gravity = 46.0
drag = 1.5
stiff_length = 1.0

[[chain]]
name = "tail_l"
bones = ["tail_l1", "tail_l2", "tail_l3"]
stiffness = 104.0
damping = 11.0
mass = 1.0
gravity = 58.0
drag = 1.8
stiff_length = 1.0
