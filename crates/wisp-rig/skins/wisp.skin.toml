# Wisp — the default NX Wisp skin (F73, revised for the chibi brief)
#
# A small round companion: an enormous head, a stubby violet body, cyan hair
# and twin trailing tails. She is meant to be *cute*, and she is meant to be
# read at 96 pixels — which is roughly the size of a browser favicon and the
# size she actually sits on a desktop.
#
# Everything here is data. There is no expression language in this format and
# no way for a skin to run code (SPEC.md §3.6).
#
# ----------------------------------------------------------------------------
# Proportion — the one decision that matters
# ----------------------------------------------------------------------------
#
# Cuteness in a small figure is almost entirely head-to-body ratio. Realistic
# is 1:7. "Chibi" is 1:2 or shorter, and F73 asks for the head to be 55-60% of
# total height. This file is built to that number and nothing else was allowed
# to push it around:
#
#     hair crown   y =  12   ─┐
#     face top     y =  24    │ head mass = 130 units
#     chin         y = 142   ─┘
#     dress hem    y = 204    │ body + legs = 86 units
#     sole         y = 228   ─┘
#                             total = 216 units, head = 60.2%
#
# Her face is 128 units wide (140 with the hair) against an 80-unit body, so
# she is a sphere on a stub. The whole figure fills 216 of the canvas's 256
# units, which is deliberate: at 96 px on screen that makes her 81 px tall
# instead of the 49 px the previous faceted design managed. Half the
# legibility win at 96 px is simply *occupying the canvas*.
#
# Eyes are 44 units wide each against a 128-unit face — 34% of face width per
# eye, and three quarters of the face given over to two eyes. That is the
# anime-chibi ratio, and at 96 px it makes each eye a legible 16 px object with
# room inside it for an iris, a pupil and two catchlights.
#
# The twin tails run from y = 40 down to y = 210, as long as she is tall, and
# they are held ~16 units clear of her head. That clearance is not decoration:
# without it the head and the tails silhouette as one wide blob and she reads
# as a lop-eared animal. The gap is the difference between "twin tails" and
# "ears", and it is worth more than any amount of gradient.
#
# ----------------------------------------------------------------------------
# Why she is round, when docs/DESIGN.md says angular
# ----------------------------------------------------------------------------
#
# SPEC.md §3.5b: DESIGN.md's angular geometry rule (radii 3-6 px, no pills, no
# round blobs) governs *chrome* — bubbles, panels, menus, the rig editor. It
# does not govern the creature. A chibi is round by definition; the previous
# revision of this file obeyed the chrome rule literally, and the result was a
# dark faceted crystal that read at 96 px as a smudge. Do not re-angularise
# her. Everything else in DESIGN.md still applies:
#
#   - One light source, upper-left. Every linear gradient runs from around
#     (74, 40) towards (182, 160); every radial puts its focus above and left
#     of its centre. Both catchlights sit upper-left in *both* eyes — they are
#     not mirrored, because there is only one light in the room.
#   - Light rides motion. `core`, `spark` and `sheen` follow the `light` bone,
#     which the rig displaces against her travel, so the highlight slides
#     through her instead of flashing.
#   - Violet leads; cyan is light inside the material. Her dress and her glow
#     are NX violet #7700ff. Her hair, her tails and her irises are cyan, and
#     every one of them is a *gradient* — cyan is never laid down as a flat
#     surface colour anywhere in this file.
#
# ----------------------------------------------------------------------------
# Reading at 96 px
# ----------------------------------------------------------------------------
#
# The rule used throughout: nothing carries information unless it is at least
# 2 px wide at 96 px, which is 5.3 canvas units. Anything smaller is texture,
# and texture is only allowed to be the difference between "good at 512" and
# "better at 512" — never between "there" and "not there" at 96. The features
# that must survive the shrink are, in order:
#
#   1. the silhouette — a big circle, two tails, a stub;
#   2. the two eyes, and the bright rim that separates her from the wallpaper;
#   3. the cyan hair mass against the violet dress;
#   4. brows and mouth, which is what makes eight expressions distinguishable.
#
# Canvas is 256x256 units and maps onto whatever pixel size the operator picks
# (F75, 48-512 px), so she is sharp on a 4K display at any size.

format = "nx-wisp-skin"
version = 1

[meta]
name = "Wisp"
author = "nerdrx"
license = "MIT"
summary = "A round little companion with a huge head, cyan twin tails and a violet dress."
default_size_px = 128.0
min_size_px = 48.0
max_size_px = 512.0

[canvas]
size = [256.0, 256.0]
# She stands, so the anchor is the sole of her feet — that is what rests on a
# title bar and what the physics body tracks.
anchor = [128.0, 228.0]

[physics]
gravity = 1500.0
drag = 0.75
restitution = 0.34
friction = 0.05
max_speed = 3600.0
rest_speed = 40.0
hard_landing_speed = 820.0
recovery_time_ms = 420.0
grab_transfer = 0.68

[motion]
# A big head on a small body wants more squash than a crystal did: exaggeration
# is what sells weight in a chibi.
squash_bone = "body"
squash_gain = 0.0008
squash_max = 0.28
squash_deadzone = 10.0
lean_bone = "body"
lean_stiffness = 210.0
lean_damping_ratio = 0.52
lean_gain = 0.44
light_bone = "light"
light_gain = 0.024
light_range = 16.0

# --- palette ----------------------------------------------------------------
# The NX anchors, named once. DESIGN.md §1.

[[color]]
name = "violet"
value = "#7700ff"

[[color]]
name = "violet_soft"
value = "#9a3cff"

[[color]]
name = "cyan"
value = "#00e5ff"

[[color]]
name = "text"
value = "#efeaff"

[[color]]
name = "deep"
value = "#12091f"

# The eye rim. Dark enough to draw the eye's outline at 96 px, violet enough
# not to read as a hole punched in her face.
[[color]]
name = "lash"
value = "#2a1250"

[[color]]
name = "pupil"
value = "#150829"

# --- gradients ---------------------------------------------------------------

# The violet bloom she sits in. Not part of the silhouette — you click through
# it (F2) — and the thing that separates her from a *light* wallpaper, where a
# bright rim alone would disappear.
[[gradient]]
name = "aura"
kind = "radial"
center = [128.0, 128.0]
focus = [104.0, 100.0]
radius = 120.0
stop_at = [0.0, 0.44, 0.74, 1.0]
stop_color = ["#7700ff59", "#7700ff2e", "#7700ff12", "#7700ff00"]

# Her face. The name is historical — this is the top-lit body gradient the
# format's tests know by name — but it now lights skin rather than glass. Pale
# lavender, not white: violet still leads even on the brightest surface she
# has, and a pale face is what carries the eyes at 96 px.
[[gradient]]
name = "glass_body"
kind = "linear"
start = [74.0, 40.0]
end = [182.0, 160.0]
stop_at = [0.0, 0.52, 1.0]
stop_color = ["#fdf8ff", "#e9daff", "#b892e4"]

# Her hair and tails. Cyan, but a *material* cyan — lit at the crown, brand
# cyan through the middle, and deep teal in shadow, so the mass has form
# instead of reading as a flat swatch.
[[gradient]]
name = "hair"
kind = "linear"
start = [62.0, 6.0]
end = [206.0, 164.0]
stop_at = [0.0, 0.3, 0.68, 1.0]
stop_color = ["#86f2ff", "#21ddff", "#00abd4", "#0a6f96"]

# The dress. NX violet, lit from the same corner.
[[gradient]]
name = "dress_lit"
kind = "linear"
start = [70.0, 132.0]
end = [190.0, 196.0]
stop_at = [0.0, 0.45, 1.0]
stop_color = ["#c98cff", "#9a3cff", "#6408d0"]

[[gradient]]
name = "dress"
kind = "linear"
start = [92.0, 120.0]
end = [172.0, 206.0]
stop_at = [0.0, 0.42, 1.0]
stop_color = ["#a855ff", "#7700ff", "#40068c"]

# The violet heart, glowing out through the dress. Follows the light bone.
[[gradient]]
name = "core"
kind = "radial"
center = [128.0, 170.0]
focus = [112.0, 154.0]
radius = 40.0
follow_bone = "light"
stop_at = [0.0, 0.34, 0.72, 1.0]
stop_color = ["#c187ffb0", "#7700ff8c", "#7700ff33", "#7700ff00"]

# The cyan mote — the light that moves *inside* her. Small, hot, and never a
# surface colour.
[[gradient]]
name = "spark"
kind = "radial"
center = [114.0, 172.0]
focus = [106.0, 164.0]
radius = 15.0
follow_bone = "light"
stop_at = [0.0, 0.32, 0.68, 1.0]
stop_color = ["#e6fcffcc", "#00e5ff99", "#00e5ff33", "#00e5ff00"]

# The light falling across the crown of her head. Kept under its old name
# because the format's tests check that it runs from the upper left; there are
# no facets left for it to fall on, only a curve.
[[gradient]]
name = "facet_light"
kind = "linear"
start = [78.0, 12.0]
end = [180.0, 96.0]
stop_at = [0.0, 0.5, 1.0]
stop_color = ["#ffffff4d", "#ffffff1a", "#ffffff00"]

# ...and the shadow the hair and the chin cast downwards. Same light, other
# side. This is what stops the face reading as a flat disc.
[[gradient]]
name = "facet_shadow"
kind = "linear"
start = [128.0, 96.0]
end = [128.0, 152.0]
stop_at = [0.0, 0.55, 1.0]
stop_color = ["#2c0d5500", "#2c0d5514", "#2c0d5540"]

# DESIGN.md's --edge-lit: bright top-left, violet, a breath of cyan, then dark.
# On a chibi this does more work than on anything else in the product — it is
# the whole reason she survives being dropped on a white window or a photo
# wallpaper.
[[gradient]]
name = "edge_lit"
kind = "linear"
start = [66.0, 16.0]
end = [196.0, 200.0]
stop_at = [0.0, 0.32, 0.62, 1.0]
stop_color = ["#ffffffff", "#e6d6ffcc", "#8be9ffa8", "#2a0a4a8c"]

# The specular band on the crown. Bound to the light bone, so it is a function
# of where she is going — not a sweep fired on an event.
[[gradient]]
name = "sheen"
kind = "linear"
start = [76.0, 14.0]
end = [166.0, 92.0]
follow_bone = "light"
stop_at = [0.0, 0.4, 0.62, 1.0]
stop_color = ["#ffffff00", "#ffffff5c", "#d6f6ff2e", "#ffffff00"]

# The tails. Same cyan material as the hair, running out along their length and
# fading as they leave her, so the trail dissolves rather than stopping.
[[gradient]]
name = "tail_glow"
kind = "linear"
start = [40.0, 8.0]
end = [252.0, 196.0]
stop_at = [0.0, 0.3, 0.66, 1.0]
stop_color = ["#5fe6fb", "#12c9ee", "#0097bd", "#075c7e"]

# The irises. One gradient per eye, because a gradient lives in canvas space
# and a single shared one would light the two eyes differently. Hot white-cyan
# at the top-left, brand cyan through the middle, deep blue at the bottom —
# that vertical ramp is what makes a flat disc read as a glassy sphere.
[[gradient]]
name = "iris_l"
kind = "radial"
center = [101.0, 99.0]
focus = [94.0, 88.0]
radius = 22.0
stop_at = [0.0, 0.5, 0.86, 1.0]
stop_color = ["#eafeff", "#35ecff", "#0aa8e2", "#0d6cc0"]

[[gradient]]
name = "iris_r"
kind = "radial"
center = [155.0, 99.0]
focus = [148.0, 88.0]
radius = 22.0
stop_at = [0.0, 0.5, 0.86, 1.0]
stop_color = ["#eafeff", "#35ecff", "#0aa8e2", "#0d6cc0"]

# Blush. Warm pink against everything else in the palette being cold, which is
# exactly why it reads at 96 px as two soft dabs of colour on her cheeks.
[[gradient]]
name = "blush_l"
kind = "radial"
center = [86.0, 128.0]
focus = [80.0, 123.0]
radius = 17.0
stop_at = [0.0, 0.55, 1.0]
stop_color = ["#ff5fb8c4", "#ff5fb87a", "#ff5fb800"]

[[gradient]]
name = "blush_r"
kind = "radial"
center = [170.0, 128.0]
focus = [164.0, 123.0]
radius = 17.0
stop_at = [0.0, 0.55, 1.0]
stop_color = ["#ff5fb8c4", "#ff5fb87a", "#ff5fb800"]

# --- skeleton ----------------------------------------------------------------
#
#   root ── body ─┬─ head ─┬─ gaze ─┬─ eye_l
#                 │        │        └─ eye_r
#                 │        ├─ brow_l
#                 │        ├─ brow_r
#                 │        ├─ mouth
#                 │        ├─ tail1   ── tail2   ── tail3      (screen right)
#                 │        └─ tail_l1 ── tail_l2 ── tail_l3    (screen left)
#                 └─ light
#
# `gaze` exists so the look-at constraint has a bone of its own: an IK
# constraint owns the rotation channel it writes, so authored head motion goes
# on `head` and the two compose instead of fighting.
#
# It pivots *below* the eyes, down at the chin, not between them. A pivot
# between the eyes only tilts them; a pivot behind and beneath them swings them
# sideways across the face, which is what reads as looking rather than as a
# head tilt.
#
# The tails hang off `head`, not off `body`, because they are hair: when she
# tilts her head they swing, and the spring chains then make them arrive late.

[[bone]]
name = "root"
pos = [128.0, 228.0]

[[bone]]
name = "body"
parent = "root"
pos = [0.0, -62.0]
length = 46.0

[[bone]]
name = "head"
parent = "body"
pos = [0.0, -56.0]
length = 60.0

[[bone]]
name = "gaze"
parent = "head"
pos = [0.0, 40.0]
length = 40.0

# The eyes sit 54 units above the gaze pivot, which puts them back at their
# authored positions (101, 96) and (155, 96).
[[bone]]
name = "eye_l"
parent = "gaze"
pos = [-27.0, -54.0]
length = 22.0

[[bone]]
name = "eye_r"
parent = "gaze"
pos = [27.0, -54.0]
length = 22.0

# Brows are the cheapest expression channel there is: two 26x7 dashes that a
# clip can raise, drop and tilt. At 96 px they are 10x3 px, which is the
# smallest thing in this file that still carries meaning.
[[bone]]
name = "brow_l"
parent = "head"
pos = [-27.0, -46.0]
length = 14.0

[[bone]]
name = "brow_r"
parent = "head"
pos = [27.0, -46.0]
length = 14.0

# The mouth is a scale channel, not a shape library: one small oval that clips
# stretch open, squash flat, or widen into a smirk.
[[bone]]
name = "mouth"
parent = "head"
pos = [0.0, 23.0]
length = 10.0

# The internal light. Nothing is parented to it; the gradients follow it.
[[bone]]
name = "light"
parent = "body"
pos = [-14.0, 8.0]
length = 10.0

# The twin tails. Bones point along their own +x: the first joint leaves the
# crown at 35 deg from horizontal so the tail swings clear of her head at once,
# and the following joints straighten towards vertical so it falls rather than
# sticks out. That out-then-down arc is what puts daylight between the tail and
# her body — without it the whole figure silhouettes as one blob, which is how
# the first three attempts at this failed.
#
# Naming: the unsuffixed chain — `tail1..3`, shapes `tail_a/b/c`, chain "tail"
# — is the tail on **screen right**; `tail_l*` mirrors it on the left. The two
# are not interchangeable. Whichever way she travels, both tails swing the same
# way relative to her head, so the gap between her body and the *downwind* tail
# opens while the upwind one closes; the rig's secondary-motion test measures
# the unsuffixed one, and it is the tail that opens.
[[bone]]
name = "tail_l1"
parent = "head"
pos = [-52.0, -70.0]
rot = 145.0
length = 48.0

[[bone]]
name = "tail_l2"
parent = "tail_l1"
pos = [48.0, 0.0]
rot = -35.0
length = 46.0

[[bone]]
name = "tail_l3"
parent = "tail_l2"
pos = [46.0, 0.0]
rot = -20.0
length = 58.0

[[bone]]
name = "tail1"
parent = "head"
pos = [52.0, -70.0]
rot = 35.0
length = 48.0

[[bone]]
name = "tail2"
parent = "tail1"
pos = [48.0, 0.0]
rot = 35.0
length = 46.0

[[bone]]
name = "tail3"
parent = "tail2"
pos = [46.0, 0.0]
rot = 20.0
length = 58.0

# --- artwork -----------------------------------------------------------------
# Drawn back to front by `z`.

# The bloom. Bound to `root` rather than `body` so it stays put while she leans
# — a small parallax that makes her read as being in front of her own glow.
[[shape]]
name = "aura"
z = 0
silhouette = false
path = "M 155.471 60.7699 C 162.189 61.7137 167.413 63.972 167.148 65.8598 C 166.882 67.7476 161.23 68.4742 154.513 67.5304 C 147.795 66.5866 142.572 64.3283 142.837 62.4405 C 143.102 60.5527 148.754 59.8261 155.471 60.7699 Z"
bind = "root"
fill = { gradient = "aura" }

# --- the twin tails ----------------------------------------------------------
# Three overlapping ribbon segments per side, each narrower than the last, so
# the pair reads as one continuous tapering tail while still being three
# shapes the spring chain can bend independently.
#
# The right tail is drawn first and the left over it, which gives the pair a
# little depth ordering at no cost. Both are rooted deep inside the head, so
# the part of the ribbon that would otherwise cut across her face is simply
# hidden behind it — that is why the roots are at (76, 40) rather than out on
# the head's edge where a hair tie would sit.

[[shape]]
name = "tail_a"
z = 2
silhouette = true
path = "M 170.249 53.9256 C 181.991 62.1475 197.1 66.6573 205.902 77.9709 C 214.249 88.6993 215.368 103.456 220.017 116.23 C 224.248 127.855 254.318 116.91 250.087 105.285 C 244.248 89.2412 243.221 70.5679 232.737 57.0925 C 221.886 43.1468 204.225 36.2092 189.751 26.0744 C 178.984 18.5351 159.482 46.3863 170.249 53.9256 Z"
bind_auto = { bones = ["tail1", "tail2"], falloff = 46.0, power = 2.0 }
fill = { gradient = "tail_glow" }
stroke = { gradient = "edge_lit", width = 2.2, alpha = 0.9, join = "round" }

[[shape]]
name = "tail_b"
z = 3
silhouette = true
path = "M 203.345 73.346 C 208.238 86.7903 217.045 99.0774 219.242 113.215 C 222.087 131.519 221.052 150.233 221.052 168.758 C 221.052 179.582 249.052 179.582 249.052 168.758 C 249.052 148.596 253.959 128.223 250.862 108.3 C 248.348 92.1226 240.894 77.1018 235.294 61.7173 C 230.798 49.3657 198.849 60.9943 203.345 73.346 Z"
bind_auto = { bones = ["tail1", "tail2", "tail3"], falloff = 40.0, power = 2.0 }
fill = { gradient = "tail_glow" }
stroke = { gradient = "edge_lit", width = 2.0, alpha = 0.85, join = "round" }

[[shape]]
name = "tail_c"
z = 4
opacity = 0.82
silhouette = false
path = "M 219.052 110.758 C 219.052 130.308 220.206 149.842 221.066 169.373 C 221.71 184.024 233.931 196.361 235.464 210.946 C 235.788 214.021 243.744 213.185 243.421 210.109 C 241.945 196.073 249.659 182.242 249.039 168.142 C 248.197 149.021 251.052 129.897 251.052 110.758 C 251.052 98.3864 219.052 98.3864 219.052 110.758 Z"
bind_auto = { bones = ["tail2", "tail3"], falloff = 34.0, power = 2.0 }
fill = { gradient = "tail_glow" }

[[shape]]
name = "tail_l_a"
z = 5
silhouette = true
path = "M 66.2492 26.0744 C 51.7752 36.2092 34.1137 43.1468 23.2634 57.0925 C 12.779 70.5679 11.7522 89.2412 5.91269 105.285 C 1.6815 116.91 31.7517 127.855 35.9829 116.23 C 40.632 103.456 41.7508 88.6993 50.098 77.9709 C 58.9004 66.6573 74.0087 62.1475 85.7508 53.9256 C 96.518 46.3863 77.0164 18.5351 66.2492 26.0744 Z"
bind_auto = { bones = ["tail_l1", "tail_l2"], falloff = 46.0, power = 2.0 }
fill = { gradient = "tail_glow" }
stroke = { gradient = "edge_lit", width = 2.2, alpha = 0.9, join = "round" }

[[shape]]
name = "tail_l_b"
z = 6
silhouette = true
path = "M 20.7059 61.7173 C 15.1064 77.1018 7.65199 92.1226 5.1376 108.3 C 2.0412 128.223 6.94778 148.596 6.94778 168.758 C 6.94778 179.582 34.9478 179.582 34.9478 168.758 C 34.9478 150.233 33.913 131.519 36.758 113.215 C 38.9552 99.0774 47.7621 86.7903 52.6555 73.346 C 57.1511 60.9943 25.2016 49.3657 20.7059 61.7173 Z"
bind_auto = { bones = ["tail_l1", "tail_l2", "tail_l3"], falloff = 40.0, power = 2.0 }
fill = { gradient = "tail_glow" }
stroke = { gradient = "edge_lit", width = 2.0, alpha = 0.85, join = "round" }

# The faintest wisp of the trail. Not clickable — it is barely there.
[[shape]]
name = "tail_l_c"
z = 7
opacity = 0.82
silhouette = false
path = "M 4.94778 110.758 C 4.94778 129.897 7.80271 149.021 6.96131 168.142 C 6.34085 182.242 14.0548 196.073 12.5795 210.109 C 12.2562 213.185 20.2124 214.021 20.5357 210.946 C 22.0686 196.361 34.2896 184.024 34.9342 169.373 C 35.7937 149.842 36.9478 130.308 36.9478 110.758 C 36.9478 98.3864 4.94778 98.3864 4.94778 110.758 Z"
bind_auto = { bones = ["tail_l2", "tail_l3"], falloff = 34.0, power = 2.0 }
fill = { gradient = "tail_glow" }

# --- the head ----------------------------------------------------------------

# The hair behind her: the same egg as the face, 12 units larger all round, so
# a 12-unit cyan rim shows around the top and sides. Twelve units is 4.5 px at
# 96, which is the thinnest a colour band can be and still be a colour rather
# than an artefact.
[[shape]]
name = "hair_back"
z = 9
silhouette = true
path = "M 128 12 C 168 12, 198 42, 198 84 C 198 118, 174 148, 128 148 C 82 148, 58 118, 58 84 C 58 42, 88 12, 128 12 Z"
bind = "head"
fill = { gradient = "hair" }

# --- the body ----------------------------------------------------------------
# Stubby, and deliberately far too small for the head.

[[shape]]
name = "arm_l"
z = 10
silhouette = true
path = "M 94.9289 140.929 C 89.6547 146.203 83.3768 150.842 79.72 157.343 C 76.2526 163.507 77.7248 171.36 76.1905 178.265 C 74.8487 184.303 90.4677 187.774 91.8095 181.735 C 92.9467 176.618 93.7099 171.226 96.28 166.657 C 99.1004 161.643 105.003 159.139 109.071 155.071 C 114.538 149.604 100.396 135.462 94.9289 140.929 Z"
bind = "body"
fill = { gradient = "dress_lit" }
stroke = { gradient = "edge_lit", width = 1.8, alpha = 0.75, join = "round" }

[[shape]]
name = "arm_r"
z = 10
silhouette = true
path = "M 146.929 155.071 C 150.997 159.139 156.9 161.643 159.72 166.657 C 162.29 171.226 163.053 176.618 164.191 181.735 C 165.532 187.774 181.151 184.303 179.809 178.265 C 178.275 171.36 179.747 163.507 176.28 157.343 C 172.623 150.842 166.345 146.203 161.071 140.929 C 155.604 135.462 141.462 149.604 146.929 155.071 Z"
bind = "body"
fill = { gradient = "dress_lit" }
stroke = { gradient = "edge_lit", width = 1.8, alpha = 0.75, join = "round" }

[[shape]]
name = "foot_l"
z = 11
silhouette = true
path = "M 110 196 C 119.389 196 127 203.163 127 212 C 127 220.837 119.389 228 110 228 C 100.611 228 93 220.837 93 212 C 93 203.163 100.611 196 110 196 Z"
bind = "body"
