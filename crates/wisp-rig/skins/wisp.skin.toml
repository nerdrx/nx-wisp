# --- skeleton ----------------------------------------------------------------
#
#   root ── body ─┬─ head ─┬─ gaze ─┬─ eye_l
#                 │        │        └─ eye_r
#                 │        ├─ brow_l
#                 │        ├─ brow_r
#                 │        ├─ mouth
#                 │        ├─ mote_l
#                 │        └─ mote_r
#                 ├─ tail1   ── tail2   ── tail3      (outer violet trail)
#                 ├─ tail_l1 ── tail_l2 ── tail_l3    (inner cyan filament)
#                 └─ light
#
# `head` is not a head. There is no head. It is the bone the whole luminous
# mass hangs off, and it exists so that `body` can carry squash and travel
# while `head` carries the tilt of the mass and the face parts ride on it. The
# two sit at the *same point* (128, 110) on purpose: with no neck there is
# nothing to pivot about except her own middle, and a mass of light that tips
# about its own middle reads far better than one that swings about a joint.
#
# The two trail chains hang off `body` rather than `head`, so a head tilt
# swings the trail as secondary motion rather than dragging it rigidly.
#
# `gaze` exists so the look-at constraint has a bone of its own: an IK
# constraint owns the rotation channel it writes, so authored motion goes on
# `head` and the two compose instead of fighting. It pivots *below* the eyes,
# down at (128, 150), not between them — a pivot between the eyes only tilts
# them, while a pivot behind and beneath swings them sideways across her,
# which is what reads as looking rather than as a tilt.

[[bone]]
name = "root"
pos = [128.0, 228.0]

[[bone]]
name = "body"
parent = "root"
pos = [0.0, -118.0]
length = 60.0

# Same point as `body`. See above: she has no neck, so the mass tips about its
# own centre.
[[bone]]
name = "head"
parent = "body"
pos = [0.0, 0.0]
length = 50.0

[[bone]]
name = "gaze"
parent = "head"
pos = [0.0, 40.0]
length = 40.0

# The eyes sit 54 units above the gaze pivot, which puts them back at their
# authored positions (101, 96) and (155, 96) — the coordinates the eye artwork
# has had since attempt 1. Nothing here may move without moving that artwork,
# and that artwork is not to move.
[[bone]]
name = "eye_l"
parent = "gaze"
pos = [-27.0, -54.0]
length = 22.0

[[bone]]
name = "eye_r"
parent = "gaze"
pos = [27.0, -54.0]
length = 22.0

# The two lights above her eyes. Cheapest expression channel there is: `ty`
# raises and drops them, `rot` tilts the inner end, and those two together are
# most of what is left of expression once a face is off the table.
[[bone]]
name = "brow_l"
parent = "head"
pos = [-27.0, -43.0]
length = 14.0

[[bone]]
name = "brow_r"
parent = "head"
pos = [27.0, -43.0]
length = 14.0

# The mouth is a scale channel, not a shape library: one tiny oval that three
# expressions open and the other five multiply away to nothing.
[[bone]]
name = "mouth"
parent = "head"
pos = [0.0, 18.0]
length = 10.0

# Her hands: two motes orbiting at her sides. Parented to `head` so they tip
# with the mass, and on their own bones so a clip can gesture with them.
[[bone]]
name = "mote_l"
parent = "head"
pos = [-88.0, 36.0]
length = 12.0

[[bone]]
name = "mote_r"
parent = "head"
pos = [92.0, 18.0]
length = 12.0

# The internal light. Nothing is parented to it; the fire gradients follow it,
# and the fire *shapes* are bound to it, so the whole flame slides through the
# glass against her travel instead of flashing.
[[bone]]
name = "light"
parent = "body"
pos = [-14.0, 8.0]
length = 10.0

# --- the two trail chains ----------------------------------------------------
#
# Bones point along their own +x, so rot = 90 is straight down. Both chains
# start inside her body and hang down the centre line; see the naming note at
# the top of this file for why they are concentric rather than a left/right
# pair, and why centring them is what keeps the rig's secondary-motion test
# honest.
#
# The outer trail is longer and its joints are progressively shorter, so the
# taper has somewhere to go and the tip whips more than the root.

[[bone]]
name = "tail1"
parent = "body"
pos = [0.0, 44.0]
rot = 90.0
length = 34.0

[[bone]]
name = "tail2"
parent = "tail1"
pos = [34.0, 0.0]
length = 28.0

[[bone]]
name = "tail3"
parent = "tail2"
pos = [28.0, 0.0]
length = 26.0

# The inner cyan filament. Starts 4 units higher and ends 20 units shorter, so
# it never pokes out of the trail it lives in.
[[bone]]
name = "tail_l1"
parent = "body"
pos = [0.0, 40.0]
rot = 90.0
length = 28.0

[[bone]]
name = "tail_l2"
parent = "tail_l1"
pos = [28.0, 0.0]
length = 24.0

[[bone]]
name = "tail_l3"
parent = "tail_l2"
pos = [24.0, 0.0]
length = 22.0

# --- artwork -----------------------------------------------------------------
# Drawn back to front by `z`. The order is: bloom, halo, trail, motes, the
# nested glass, the fire, the eyes, the mouth, the eye-lights, her hands, and
# the lit rim last so nothing covers it.

# The bloom. Bound to `root` rather than `body` so it stays put while she
# leans — a small parallax that makes her read as being in front of her own
# glow.
[[shape]]
name = "aura"
z = 0
silhouette = false
path = "M 128 8 C 194 8, 248 62, 248 128 C 248 194, 194 248, 128 248 C 62 248, 8 194, 8 128 C 8 62, 62 8, 128 8 Z"
bind = "root"
