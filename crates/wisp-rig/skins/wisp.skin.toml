# --- the hair ties -----------------------------------------------------------
# Rectangular, dark maroon, set at 45 degrees across the root of each tail,
# with a grey-silver band down the middle. This is the single most iconic cue
# the reference character has, and it is the reason two teal masses beside a
# head read as twintails and not as ears. They are 30 by 18 units — 11 by 7 px
# at 96 — and they straddle the join, half on the skull and half on the tail,
# which is also what hides the seam where the tail shape leaves the head.
#
# They bind to the tail's *first* bone, so they swing with the root. A tie that
# stayed put while the tail moved would make the tail look detached, which is
