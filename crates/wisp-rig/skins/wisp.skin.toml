# The mouth. One tiny soft oval, 22 units across, sitting on the fire so it
# reads as a shadow *in* light rather than as a hole punched in her.
#
# It is the one place uncanniness can creep back in — eyes plus a mouth is a
# face, and a face is what attempt 2 died of — so it is rationed hard: only
# `delighted`, `sleepy` and `alarmed` open it. The other five expressions
# drive its bone `alpha` to 0 and it vanishes completely. Expression clips can
# only scale it and fade it, which is exactly the right amount of power for it
# to have.
[[shape]]
name = "mouth"
z = 34
silhouette = false
path = """
M 128 121
C 134 121, 139 124.5, 139 128.5
C 139 133.5, 134 137, 128 137
C 122 137, 117 133.5, 117 128.5
C 117 124.5, 122 121, 128 121
Z"""
bind = "mouth"
