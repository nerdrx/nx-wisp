[package]
name = "wisp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The NX Wisp host process: wiring, event loop, CLI, config and the flight recorder."

[lib]
name = "wisp"
path = "src/lib.rs"

[[bin]]
name = "nx-wisp"
path = "src/main.rs"

[dependencies]
wisp-proto  = { path = "../wisp-proto" }
wisp-gov    = { path = "../wisp-gov" }
wisp-senses = { path = "../wisp-senses" }
wisp-attn   = { path = "../wisp-attn" }
wisp-fleet  = { path = "../wisp-fleet" }
wisp-rig    = { path = "../wisp-rig" }
wisp-shell  = { path = "../wisp-shell" }
wisp-paint  = { path = "../wisp-paint" }
wisp-editor = { path = "../wisp-editor" }
wisp-mind   = { path = "../wisp-mind" }
wisp-voice  = { path = "../wisp-voice" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "sync",
    "time",
    "macros",
    "fs",
    "signal",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
anyhow = "1.0.100"
libc = "0.2.189"

# `doctor` asks the compositor which globals it advertises. Registry
# enumeration only: this crate never creates a surface — that is `wisp-shell`'s
# and only `wisp-shell`'s.
wayland-client = "0.31.11"

[dev-dependencies]
tempfile = "3.23.0"
tokio = { version = "1.53.1", features = ["test-util"] }

[features]
default = []
# llama.cpp on Vulkan for real cognition. Needs VULKAN_SDK staged (see env.sh);
# the default build uses the deterministic mock and needs neither GPU nor
# headers, which is what CI runs.
mind-llama = ["wisp-mind/vulkan"]
# Piper TTS for a real voice. Needs the ort cache (see env.sh).
#
# whisper-stt is deliberately NOT here: llama.cpp and whisper.cpp each bundle
# their own ggml, and linking both statically into one binary is a wall of
# duplicate-symbol errors. Nothing is lost today — there is no microphone
# capture backend yet, so shipped STT would be dead weight. When the mic
# lands, whisper needs to build against llama's ggml rather than its own.
voice-piper = ["wisp-voice/piper-tts", "wisp-voice/net", "wisp-voice/consent"]
# What the release AppImage ships.
full = ["mind-llama", "voice-piper"]
