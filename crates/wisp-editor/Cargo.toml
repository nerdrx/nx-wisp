[package]
name = "wisp-editor"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The in-app rig editor (F76): editor state, commands, undo/redo, and panel scene building."

[dependencies]
wisp-proto = { path = "../wisp-proto" }
wisp-rig   = { path = "../wisp-rig" }
wisp-paint = { path = "../wisp-paint" }
wisp-theme = { path = "../wisp-theme" }

serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1"
toml_edit = "0.25"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.23"
png = "0.18.1"
